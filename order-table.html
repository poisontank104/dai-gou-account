<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>訂購統計表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif}
body{background:#f7f8fa;padding:20px}
.container{max-width:1200px;margin:0 auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 2px 10px #00000012}
h1{font-size:22px;margin-bottom:16px;color:#333}
.back{display:inline-block;padding:8px 14px;background:#8a7cd8;color:#fff;border-radius:8px;text-decoration:none;margin-bottom:16px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #ddd;padding:8px;text-align:center}
th{background:#f1f0f8}
input{width:100%;padding:6px;border:1px solid #ccc;border-radius:6px}
.btns{margin:16px 0}
button{padding:8px 14px;border:none;border-radius:8px;background:#8a7cd8;color:white;margin-right:8px;cursor:pointer}
.total{font-weight:bold;font-size:16px;margin-top:12px;color:#553ea8}
</style>
</head>
<body>
<div class="container">
  <a href="index.html" class="back">← 返回首頁</a>
  <h1>📋 訂購統計表</h1>
  <div class="btns">
    <button onclick="addRow()">新增一列</button>
    <button onclick="calcAll()">重新計算</button>
  </div>
  <table id="orderTable">
    <thead>
      <tr>
        <th>商品名稱</th>
        <th>數量</th>
        <th>人民幣金額</th>
        <th>匯率</th>
        <th>台幣金額</th>
        <th>預計刷卡手續費</th>
        <th>付款方式</th>
        <th>日期</th>
        <th>訂購帳號</th>
        <th>備註</th>
        <th>刪除</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>
  <div class="total" id="sumText">合計台幣：0 元</div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzkW5TmNKx4cbU06idsSeNs9x8v7XxwNYBOVO7et9vDoipJ7BkVx5iGM82yY1vpUt9nsg/exec";
function addRow(){
  const tb = document.querySelector('#orderTable tbody');  const tr = document.createElement('tr');
  tr.innerHTML = `
    <td><input type="text" class="name"></td>
    <td><input type="number" class="qty" value="1"></td>
    <td><input type="number" class="rmb" value="0" onchange="calcAll()"></td>
    <td><input type="number" class="rate" step="0.0001" value="4.3" onchange="calcAll()"></td>
    <td><input type="number" class="twd" readonly></td>
    <td><input type="number" class="fee" value="0" onchange="calcAll()"></td>
    <td><input type="text" class="pay"></td>
    <td><input type="date" class="dt"></td>
    <td><input type="text" class="acc"></td>
    <td><input type="text" class="note"></td>
    <td><button onclick="this.closest('tr').remove();calcAll()">刪除</button></td>
  `
  tb.appendChild(tr);
  calcAll();
}

// 全部計算
function calcAll(){
  const rows = document.querySelectorAll('#orderTable tbody tr');
  let total = 0;
  rows.forEach(r=>{
    const rmb = Number(r.querySelector('.rmb').value) || 0;
    const rate = Number(r.querySelector('.rate').value) || 0;
    const fee = Number(r.querySelector('.fee').value) || 0;
    const twd = rmb * rate + fee;
    r.querySelector('.twd').value = twd.toFixed(2);
    total += twd;
  })
  document.getElementById('sumText').innerText = `合計台幣：${total.toFixed(2)} 元`
}

// 預設先產生第一列
addRow();
</script>
</body>
</html>
