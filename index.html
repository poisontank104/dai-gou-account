<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代購記帳系統</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;margin:0;padding:0}
body{padding:16px;background:#f7f5ff;color:#333}
h2{color:#6b4fc7;margin-bottom:16px}
.section{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #00000012}
.group-title{background:#9370db;color:#fff;padding:10px 14px;border-radius:10px;margin:12px 0;font-weight:bold;font-size:18px}
.row{display:grid;grid-template-columns: repeat(auto-fit, minmax(190px,1fr));gap:10px;margin-bottom:10px}
.item{display:flex;flex-direction:column}
label{font-size:13px;color:#555;margin-bottom:4px}
input, select, textarea{padding:8px 10px;border:1px solid #d9d2ee;border-radius:8px;font-size:14px}
button{cursor:pointer;border:none;border-radius:9px;padding:9px 14px;font-size:14px}
.btn-primary{background:#9370db;color:#fff}
.btn-success{background:#48b870;color:#fff}
.btn-warning{background:#e6a849;color:#fff}
.btn-danger{background:#dd5555;color:#fff}
.btn-add-line{opacity:0.7;background:#b8a0e8;color:#fff;margin:8px 0}
.photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photo-preview img{width:100px;height:100px;object-fit:cover;border-radius:6px;border:1px solid #ddd}
.product-block{border:1px dashed #c9bcee;border-radius:10px;padding:12px;margin:10px 0}
.record-card{border:1px solid #e5e0f7;border-radius:12px;padding:14px;margin:10px 0}
.record-card .action-bar{margin-top:10px;display:flex;gap:8px}
.modal{position:fixed;inset:0;background:#00000044;display:flex;align-items:center;justify-content:center;padding:16px;z-index:999}
.modal-inner{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:1100px;max-height:90vh;overflow-y:auto}
.hidden{display:none !important}
.note{grid-column:1/-1}
</style>
</head>
<body>
<h2>📒 代購記帳</h2>
<div class="section">
  <h3>新增訂單</h3>
  <div id="formWrap">
    <div class="row">
      <div class="item">
        <label>訂購日期</label>
        <input type="date" id="orderDate">
      </div>
      <div class="item">
        <label>訂購帳號</label>
        <input type="text" id="orderAccount">
      </div>
      <div class="item">
        <label>藝人</label>
        <input type="text" id="artist">
      </div>
    </div>

    <h4 style="margin:10px 0">商品組（可多組）</h4>
    <div id="productList"></div>
    <button class="btn-add-line" onclick="addProductRow()">+ 新增商品組</button>

    <div class="row">
      <div class="item">
        <label>原人民幣金額¥</label>
        <input type="number" step="0.01" id="oriRmb">
      </div>
      <div class="item">
        <label>實收人民幣金額¥</label>
        <input type="number" step="0.01" id="realRmb" oninput="calcAll()">
      </div>
      <div class="item">
        <label>實刷台幣金額$</label>
        <input type="number" step="0.01" id="swipeTwd" oninput="calcAll()">
      </div>
      <div class="item">
        <label>實收台幣金額$</label>
        <input type="number" step="0.01" id="realTwd" oninput="calcAll()">
      </div>
      <div class="item">
        <label>預計刷卡手續費$</label>
        <input type="number" step="0" id="fee" readonly>
      </div>
      <div class="item">
        <label>匯率</label>
        <input type="number" step="0.0001" id="rate" readonly>
      </div>
      <div class="item">
        <label>實際賺取費用$</label>
        <input type="number" step="0.01" id="profit" readonly>
      </div>
    </div>

    <div class="row">
      <div class="item">
        <label>付款方式</label>
        <select id="payType">
          <option>支付寶¥-中信</option>
          <option>支付寶¥-國泰</option>
          <option>支付寶-¥餘額</option>
          <option>微信¥-中信</option>
          <option>微信¥-國泰</option>
          <option>微信-¥餘額</option>
          <option>中信$</option>
          <option>郵局$</option>
          <option>台新$</option>
          <option>國泰$</option>
          <option>台灣配$</option>
          <option value="_custom">自訂...</option>
        </select>
        <input type="text" id="payTypeCustom" class="hidden" placeholder="輸入自訂付款方式">
      </div>
      <div class="item">
        <label>收款來源</label>
        <select id="receiveSource">
          <option>中信$</option>
          <option>郵局$</option>
          <option>中信無卡</option>
          <option>台新$</option>
          <option>台新無卡</option>
          <option>國泰$</option>
          <option>台灣配$</option>
          <option>LINE BANK</option>
          <option>i pass money</option>
          <option>line pay money</option>
          <option value="_custom">自訂...</option>
        </select>
        <input type="text" id="receiveSourceCustom" class="hidden" placeholder="輸入自訂收款來源">
      </div>
      <div class="item">
        <label>收款日期</label>
        <input type="date" id="receiveDate">
      </div>
      <div class="item">
        <label>下單來源</label>
        <select id="sourceSel">
          <option>淘寶</option>
          <option>淘寶（騰訊）</option>
          <option>淘寶（優酷）</option>
          <option>淘寶（愛奇藝）</option>
          <option>騰訊</option>
          <option>優酷</option>
          <option>愛奇藝</option>
          <option>小芒</option>
          <option>微店</option>
          <option>微信（拼團呀）</option>
          <option>微信（拼谷）</option>
          <option>閑魚</option>
          <option>小紅書</option>
          <option>抖音</option>
          <option>京東</option>
          <option>QQ音樂</option>
          <option>酷狗音樂</option>
          <option>網易雲</option>
          <option>拼多多</option>
          <option>阿里巴巴</option>
          <option>微博</option>
          <option>紛玩島</option>
          <option>大麥</option>
          <option>百度網盤</option>
          <option value="_custom">自訂...</option>
        </select>
        <input type="text" id="sourceCustom" class="hidden" placeholder="自訂下單來源">
      </div>
    </div>

    <div class="row">
      <div class="item">
        <label>照片（多張可上傳）</label>
        <input type="file" id="photoInput" accept="image/*" multiple>
        <div class="photo-preview" id="photoPreview"></div>
      </div>
      <div class="item note">
        <label>備註</label>
        <textarea id="note" rows="3"></textarea>
      </div>
    </div>

    <div style="margin-top:14px;display:flex;gap:10px">
      <button class="btn-success" onclick="submitRecord()">✅ 儲存訂單</button>
      <button class="btn-primary" onclick="loadAllRecords()">🔄 重新讀取全部紀錄</button>
    </div>
  </div>
</div>

<div class="section">
  <h3>📋 全部記帳紀錄</h3>
  <div id="recordList"></div>
</div>

<!-- 編輯彈窗 -->
<div class="modal hidden" id="editModal">
  <div class="modal-inner">
    <h3>編輯訂單</h3>
    <input type="hidden" id="editId">
    <div class="row">
      <div class="item">
        <label>訂購日期</label>
        <input type="date" id="e_orderDate">
      </div>
      <div class="item">
        <label>訂購帳號</label>

      </div>
      <div class="item">
        <label>藝人</label>
        <input type="text" id="e_artist">
      </div>
    </div>
    <h4 style="margin:10px 0">商品組</h4>
    <div id="e_productList"></div>
    <button class="btn-add-line" onclick="addEditProductRow()">+ 新增商品組</button>
    <div class="row">
      <div class="item">
        <label>原人民幣金額¥</label>
        <input type="number" step="0.01" id="e_oriRmb">
      </div>
      <div class="item">
        <label>實收人民幣金額¥</label>
        <input type="number" step="0.01" id="e_realRmb" oninput="calcEditAll()">
      </div>
      <div class="item">
        <label>實刷台幣金額$</label>
        <input type="number" step="0.01" id="e_swipeTwd" oninput="calcEditAll()">
      </div>
      <div class="item">
        <label>實收台幣金額$</label>
        <input type="number" step="0.01" id="e_realTwd" oninput="calcEditAll()">
      </div>
      <div class="item">
        <label>預計刷卡手續費$</label>
        <input type="number" step="0" id="e_fee" readonly>
      </div>
      <div class="item">
        <label>匯率</label>
        <input type="number" step="0.0001" id="e_rate" readonly>
      </div>
      <div class="item">
        <label>實際賺取費用$</label>
        <input type="number" step="0.01" id="e_profit" readonly>
      </div>
    </div>
    <div class="row">
      <div class="item">
        <label>付款方式</label>
        <select id="e_payType">
          <option>支付寶¥-中信</option>
          <option>支付寶¥-國泰</option>
          <option>支付寶-¥餘額</option>
          <option>微信¥-中信</option>
          <option>微信¥-國泰</option>
          <option>微信-¥餘額</option>
          <option>中信$</option>
          <option>郵局$</option>
          <option>台新$</option>
          <option>國泰$</option>
          <option>台灣配$</option>
          <option value="_custom">自訂...</option>
        </select>
        <input type="text" id="e_payTypeCustom" class="hidden">
      </div>
      <div class="item">
        <label>收款來源</label>
        <select id="e_receiveSource">
          <option>中信$</option>
          <option>郵局$</option>
          <option>中信無卡</option>
          <option>台新$</option>
          <option>台新無卡</option>
          <option>國泰$</option>
          <option>台灣配$</option>
          <option>LINE BANK</option>
          <option>i pass money</option>
          <option>line pay money</option>
          <option value="_custom">自訂...</option>
        </select>
        <input type="text" id="e_receiveSourceCustom" class="hidden">
      </div>
      <div class="item">
        <label>收款日期</label>
        <input type="date" id="e_receiveDate">
      </div>
      <div class="item">
        <label>下單來源</label>
        <select id="e_sourceSel">
          <option>淘寶</option>
          <option>淘寶（騰訊）</option>
          <option>淘寶（優酷）</option>
          <option>淘寶（愛奇藝）</option>
          <option>騰訊</option>
          <option>優酷</option>
          <option>愛奇藝</option>
          <option>小芒</option>
          <option>微店</option>
          <option>微信（拼團呀）</option>
          <option>微信（拼谷）</option>
          <option>閑魚</option>
          <option>小紅書</option>
          <option>抖音</option>
          <option>京東</option>
          <option>QQ音樂</option>
          <option>酷狗音樂</option>
          <option>網易雲</option>
          <option>拼多多</option>
          <option>阿里巴巴</option>
          <option>微博</option>
          <option>紛玩島</option>
          <option>大麥</option>
          <option>百度網盤</option>
          <option value="_custom">自訂...</option>
        </select>
        <input type="text" id="e_sourceCustom" class="hidden">
      </div>
    </div>
    <div class="row">
      <div class="item">
        <label>照片</label>
        <input type="file" id="e_photoInput" accept="image/*" multiple>
        <div class="photo-preview" id="e_photoPreview"></div>
      </div>
      <div class="item note">
        <label>備註</label>
        <textarea id="e_note" rows="3"></textarea>
      </div>
    </div>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="btn-success" onclick="saveEdit()">儲存修改</button>
      <button class="btn-danger" onclick="closeEditModal()">取消</button>
    </div>
  </div>
</div>

<script>
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzkW5TmNKx4cbU06idsSeNs9x8v7XxwNYBOVO7et9vDoipJ7BkVx5iGM82yY1vpUt9nsg/exec";
let photoList = [];
let editPhotoList = [];
let allRecords = [];

// 今日日期
function getTodayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

// 初始化
document.querySelector("#orderDate").value = getTodayStr();
document.querySelector("#receiveDate").value = getTodayStr();
addProductRow();
loadAllRecords();

// 下拉自訂顯示切換
document.querySelector("#payType").onchange = function(){
  document.querySelector("#payTypeCustom").classList.toggle("hidden", this.value!="_custom");
}
document.querySelector("#receiveSource").onchange = function(){
  document.querySelector("#receiveSourceCustom").classList.toggle("hidden", this.value!="_custom");
}
document.querySelector("#sourceSel").onchange = function(){
  document.querySelector("#sourceCustom").classList.toggle("hidden", this.value!="_custom");
}
document.querySelector("#e_payType").onchange = function(){
  document.querySelector("#e_payTypeCustom").classList.toggle("hidden", this.value!="_custom");
}
document.querySelector("#e_receiveSource").onchange = function(){
  document.querySelector("#e_receiveSourceCustom").classList.toggle("hidden", this.value!="_custom");
}
document.querySelector("#e_sourceSel").onchange = function(){
  document.querySelector("#e_sourceCustom").classList.toggle("hidden", this.value!="_custom");
}

// 新增商品組
function addProductRow(){
  const wrap = document.getElementById("productList");
  const div = document.createElement("div");
  div.className="product-block";
  div.innerHTML = `
  <div class="row">
    <div class="item"><label>商品名稱</label><input type="text" class="p_name"></div>
    <div class="item"><label>款式</label><input type="text" class="p_style"></div>
    <div class="item"><label>數量</label><input type="number" class="p_qty" value="1"></div>
    <div class="item"><button class="btn-danger" onclick="this.closest('.product-block').remove()">刪除這組</button></div>
  </div>`;
  wrap.appendChild(div);
}
function addEditProductRow(){
  const wrap = document.getElementById("e_productList");
  const div = document.createElement("div");
  div.className="product-block";
  div.innerHTML = `
  <div class="row">
    <div class="item"><label>商品名稱</label><input type="text" class="ep_name"></div>
    <div class="item"><label>款式</label><input type="text" class="ep_style"></div>
    <div class="item"><label>數量</label><input type="number" class="ep_qty" value="1"></div>
    <div class="item"><button class="btn-danger" onclick="this.closest('.product-block').remove()">刪除這組</button></div>
  </div>`;
  wrap.appendChild(div);
}

// 計算公式
function calcAll(){
  const rt = Number(document.querySelector("#realTwd").value||0);
  const rmb = Number(document.querySelector("#realRmb").value||0);
  const swipe = Number(document.querySelector("#swipeTwd").value||0);
  const fee = Math.round(rt * 0.015);
  const rate = rmb>0 ? (rt / rmb).toFixed(4) : 0;
  const profit = rt - (swipe + fee);
  document.querySelector("#fee").value = fee;
  document.querySelector("#rate").value = rate;
  document.querySelector("#profit").value = profit.toFixed(2);
}
function calcEditAll(){
  const rt = Number(document.querySelector("#e_realTwd").value||0);
  const rmb = Number(document.querySelector("#e_realRmb").value||0);
  const swipe = Number(document.querySelector("#e_swipeTwd").value||0);
  const fee = Math.round(rt * 0.015);
  const rate = rmb>0 ? (rt / rmb).toFixed(4) : 0;
  const profit = rt - (swipe + fee);
  document.querySelector("#e_fee").value = fee;
  document.querySelector("#e_rate").value = rate;
  document.querySelector("#e_profit").value = profit.toFixed(2);
}

// 照片上傳預覽
document.querySelector("#photoInput").onchange = async function(e){
  const files = e.target.files;
  for(let f of files){
    const base64 = await fileToBase64(f);
    photoList.push(base64);
    renderPhotoPreview();
  }
}
document.querySelector("#e_photoInput").onchange = async function(e){
  const files = e.target.files;
  for(let f of files){
    const base64 = await fileToBase64(f);
    editPhotoList.push(base64);
    renderEditPhotoPreview();
  }
}
function fileToBase64(file){
  return new Promise(resolve=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.readAsDataURL(file);
  })
}
function renderPhotoPreview(){
  const wrap = document.getElementById("photoPreview");
  wrap.innerHTML = "";
  photoList.forEach((src,i)=>{
    wrap.innerHTML += `<div><img src="${src}"><button onclick="photoList.splice(${i},1);renderPhotoPreview()">X</button></div>`
  })
}
function renderEditPhotoPreview(){
  const wrap = document.getElementById("e_photoPreview");
  wrap.innerHTML = "";
  editPhotoList.forEach((src,i)=>{
    wrap.innerHTML += `<div><img src="${src}"><button onclick="editPhotoList.splice(${i},1);renderEditPhotoPreview()">X</button></div>`
  })
}

// 收集商品組
function getProductList(selector){
  const arr = [];
  document.querySelectorAll(selector).forEach(block=>{
    arr.push({
      name:block.querySelector(".p_name, .ep_name").value,
      style:block.querySelector(".p_style, .ep_style").value,
      qty:block.querySelector(".p_qty, .ep_qty").value
    })
  })
  return arr;
}

// 送出新增
async function submitRecord(){
  let payType = document.querySelector("#payType").value;
  if(payType==="_custom") payType = document.querySelector("#payTypeCustom").value;
  let receiveSource = document.querySelector("#receiveSource").value;
  if(receiveSource==="_custom") receiveSource = document.querySelector("#receiveSourceCustom").value;
  let sourceSel = document.querySelector("#sourceSel").value;
  if(sourceSel==="_custom") sourceSel = document.querySelector("#sourceCustom").value;

  const data = {
    id:Date.now().toString(),
    orderDate:document.querySelector("#orderDate").value,
    orderAccount:document.querySelector("#orderAccount").value,
    artist:document.querySelector("#artist").value,
    products:getProductList("#productList .product-block"),
    oriRmb:document.querySelector("#oriRmb").value,
    realRmb:document.querySelector("#realRmb").value,
    swipeTwd:document.querySelector("#swipeTwd").value,
    realTwd:document.querySelector("#realTwd").value,
    fee:document.querySelector("#fee").value,
    rate:document.querySelector("#rate").value,
    profit:document.querySelector("#profit").value,
    payType:payType,
    receiveSource:receiveSource,
    receiveDate:document.querySelector("#receiveDate").value,
    source:sourceSel,
    photos:photoList,
    note:document.querySelector("#note").value
  }
  const res = await fetch(WEB_APP_URL,{method:"POST",body:JSON.stringify(data)});
  alert("✅ 儲存成功");
  photoList=[];renderPhotoPreview();
  document.getElementById("productList").innerHTML="";addProductRow();
  loadAllRecords();
}

// 讀取全部 + 年月分組
async function loadAllRecords(){
  const res = await fetch(WEB_APP_URL);
  allRecords = await res.json();
  const group = {};
  allRecords.forEach(r=>{
    const [y,m] = r.orderDate.split("-");
    const key = `${y}-${m}`;
    if(!group[key]) group[key]=[];
    group[key].push(r);
  })
  const wrap = document.getElementById("recordList");
  wrap.innerHTML = "";
  Object.keys(group).sort().reverse().forEach(ym=>{
    wrap.innerHTML += `<div class="group-title">📅 ${ym}</div>`;
    group[ym].forEach(rec=>{
      wrap.innerHTML += `
      <div class="record-card">
        <div><b>訂購帳號：</b>${rec.orderAccount}｜<b>藝人：</b>${rec.artist}</div>
        <div><b>訂購日期：</b>${rec.orderDate}</div>
        <div><b>商品：</b>${rec.products.map(p=>`${p.name} ${p.style} ×${p.qty}`).join("、")}</div>
        <div><b>實收人民幣：</b>¥${rec.realRmb}｜<b>實收台幣：</b>$${rec.realTwd}</div>
        <div><b>賺取費用：</b>$${rec.profit}</div>
        <div class="action-bar">
          <button class="btn-warning" onclick="openEdit('${rec.id}')">✏️ 編輯</button>
        </div>
      </div>`
    })
  })
}

// 打開編輯彈窗
function openEdit(id){
  const rec = allRecords.find(x=>x.id===id);
  if(!rec) return;
  document.querySelector("#editId").value = rec.id;
  document.querySelector("#e_orderDate").value = rec.orderDate;
  document.querySelector("#e_orderAccount").value = rec.orderAccount;
  document.querySelector("#e_artist").value = rec.artist;
  document.querySelector("#e_oriRmb").value = rec.oriRmb;
  document.querySelector("#e_realRmb").value = rec.realRmb;
  document.querySelector("#e_swipeTwd").value = rec.swipeTwd;
  document.querySelector("#e_realTwd").value = rec.realTwd;
  document.querySelector("#e_fee").value = rec.fee;
  document.querySelector("#e_rate").value = rec.rate;
  document.querySelector("#e_profit").value = rec.profit;
  document.querySelector("#e_payType").value = rec.payType;
  document.querySelector("#e_receiveSource").value = rec.receiveSource;
  document.querySelector("#e_receiveDate").value = rec.receiveDate;
  document.querySelector("#e_sourceSel").value = rec.source;
  document.querySelector("#e_note").value = rec.note;
  editPhotoList = rec.photos || [];
  renderEditPhotoPreview();
  // 商品組
  const epWrap = document.getElementById("e_productList");
  epWrap.innerHTML="";
  rec.products.forEach(p=>{
    const div = document.createElement("div");
    div.className="product-block";
    div.innerHTML = `
    <div class="row">
      <div class="item"><label>商品名稱</label><input type="text" class="ep_name" value="${p.name}"></div>
      <div class="item"><label>款式</label><input type="text" class="ep_style" value="${p.style}"></div>
      <div class="item"><label>數量</label><input type="number" class="ep_qty" value="${p.qty}"></div>
      <div class="item"><button class="btn-danger" onclick="this.closest('.product-block').remove()">刪除這組</button></div>
    </div>`;
    epWrap.appendChild(div);
  })
  document.getElementById("editModal").classList.remove("hidden");
}
function closeEditModal(){
  document.getElementById("editModal").classList.add("hidden");
}
async function saveEdit(){
  const id = document.querySelector("#editId").value;
  let payType = document.querySelector("#e_payType").value;
  if(payType==="_custom") payType = document.querySelector("#e_payTypeCustom").value;
  let receiveSource = document.querySelector("#e_receiveSource").value;
  if(receiveSource==="_custom") receiveSource = document.querySelector("#e_receiveSourceCustom").value;
  let sourceSel = document.querySelector("#e_sourceSel").value;
  if(sourceSel==="_custom") sourceSel = document.querySelector("#e_sourceCustom").value;

  const data = {
    id:id,
    orderDate:document.querySelector("#e_orderDate").value,
    orderAccount:document.querySelector("#e_orderAccount").value,
    artist:document.querySelector("#e_artist").value,
    products:getProductList("#e_productList .product-block"),
    oriRmb:document.querySelector("#e_oriRmb").value,
    realRmb:document.querySelector("#e_realRmb").value,
    swipeTwd:document.querySelector("#e_swipeTwd").value,
    realTwd:document.querySelector("#e_realTwd").value,
    fee:document.querySelector("#e_fee").value,
    rate:document.querySelector("#e_rate").value,
    profit:document.querySelector("#e_profit").value,
    payType:payType,
    receiveSource:receiveSource,
    receiveDate:document.querySelector("#e_receiveDate").value,
    source:sourceSel,
    photos:editPhotoList,
    note:document.querySelector("#e_note").value
  }
  await fetch(WEB_APP_URL,{method:"POST",body:JSON.stringify(data)});
  alert("✅ 修改儲存完成");
  closeEditModal();
  loadAllRecords();
}
</script>
</body>
</html>
