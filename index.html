<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>代購記帳</title>
<style>
:root{
  --main-purple:#e9e4f5;
  --purple-dark:#b8aed8;
  --blue-light:#c8d8f0;
  --green-light:#d0e9dd;
  --text:#333;
  --bg:white;
  --border:#ddd;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{background:var(--main-purple);color:var(--text);padding:12px;}
.container{max-width:900px;margin:0 auto;background:var(--bg);border-radius:16px;padding:16px;box-shadow:0 2px 12px #00000015;}
h2{text-align:center;margin-bottom:16px;color:#6b5b95;}
.block{margin-bottom:14px;border:1px solid var(--border);border-radius:12px;overflow:hidden;}
.block-title{background:var(--purple-dark);color:#fff;padding:10px 14px;cursor:pointer;font-weight:bold;display:flex;justify-content:space-between;align-items:center;}
.block-content{padding:14px;display:none;}
.block-content.open{display:block;}
.row{display:grid;gap:10px;margin-bottom:10px;}
.row-2{grid-template-columns:1fr 1fr;}
.row-3{grid-template-columns:1fr 1fr 1fr;}
.row-4{grid-template-columns:1fr 1fr 1fr 1fr;}
label{display:block;font-size:14px;margin-bottom:4px;color:#555;}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:15px;}
textarea{resize:vertical;min-height:70px;}
.btn{padding:9px 14px;border:none;border-radius:8px;background:#6b5b95;color:#fff;cursor:pointer;font-size:15px;margin-right:8px;margin-top:6px;}
.btn-del{background:#c75b5b;}
.btn-add{background:#5b8ac7;}
.item-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
.photo-box{width:70px;height:70px;border:1px dashed #aaa;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;background:#f7f7f7;position:relative;}
.photo-box svg{width:32px;height:32px;opacity:0.7;}
.photo-box img{width:100%;height:100%;object-fit:cover;}
.photo-box input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;}
.product-group{border:1px solid #e2e2e2;border-radius:10px;padding:12px;margin:8px 0;}
.add-product-btn{opacity:0.7;padding:8px;border:1px dashed #888;border-radius:8px;background:#fafafa;width:100%;cursor:pointer;margin-top:6px;}
.search-bar{margin-bottom:14px;}
.group-title{background:#f0ecf8;padding:8px 10px;border-radius:8px;margin:12px 0 4px;font-weight:bold;color:#6b5b95;}
.record-item{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;}
.edit-btn{font-size:14px;padding:5px 8px;background:#7c6cb6;color:#fff;border-radius:6px;border:none;cursor:pointer;margin-top:6px;}
.section-title{font-weight:bold;margin:10px 0 4px;color:#6b5b95;}
</style>
</head>
<body>
<div class="container">
<h2>代購記帳</h2>

<div class="search-bar">
  <input type="text" id="searchInput" placeholder="關鍵字搜尋（人劇綜、商品、訂單、平台...）">
</div>

<!-- 單品項 -->
<div class="block">
  <div class="block-title" onclick="toggleBlock('single')">單品項 <span>▼</span></div>
  <div class="block-content" id="single">
    <div class="row row-2">
      <div>
        <label>訂購帳號</label>
        <input type="text" id="s_orderAccount">
      </div>
      <div>
        <label>訂購日期</label>
        <input type="date" id="s_orderDate">
      </div>
    </div>
    <div class="row row-4">
      <div>
        <label>人劇綜</label>
        <input type="text" id="s_artist">
      </div>
      <div>
        <label>商品名稱</label>
        <input type="text" id="s_goods">
      </div>
      <div>
        <label>款式</label>
        <input type="text" id="s_style">
      </div>
      <div>
        <label>數量</label>
        <input type="number" min="1" id="s_qty">
      </div>
    </div>
    <div class="row row-3">
      <div>
        <label>原人民幣金額¥</label>
        <input type="number" step="0.01" id="s_rmbOriginal">
      </div>
      <div>
        <label>實付人民幣金額¥</label>
        <input type="number" step="0.01" id="s_rmbPay">
      </div>
      <div>
        <label>實付台幣金額$</label>
        <input type="number" step="0.01" id="s_twdPay" oninput="calcFeeSingle()">
      </div>
    </div>
    <div class="row row-3">
      <div>
        <label>預計刷卡手續費$</label>
        <input type="number" id="s_fee" readonly>
      </div>
      <div>
        <label>匯率</label>
        <input type="number" step="0.0001" id="s_rate">
      </div>
      <div>
        <label>實際利潤$</label>
        <input type="number" step="0.01" id="s_profit">
      </div>
    </div>
    <div class="section-title">客人入帳</div>
    <div class="row row-3">
      <div>
        <label>實收台幣金額$</label>
        <input type="number" step="0.01" id="s_twdReceive">
      </div>
      <div>
        <label>付款方式</label>
        <input type="text" id="s_payWay">
      </div>
      <div>
        <label>收款來源</label>
        <input type="text" id="s_receiveSource">
      </div>
    </div>
    <div class="row row-2">
      <div>
        <label>收款日期</label>
        <input type="date" id="s_receiveDate">
      </div>
      <div>
        <label>下單平台</label>
        <select id="s_platform">
          <option value="">請選擇</option>
          <option>淘寶</option>
          <option>淘寶（騰訊）</option>
          <option>淘寶（優酷）</option>
          <option>淘寶（愛奇藝）</option>
          <option>騰訊</option>
          <option>優酷</option>
          <option>愛奇藝</option>
          <option>小芒</option>
          <option>微店</option>
          <option>微信（拼團呀）</option>
          <option>微信（拼谷）</option>
          <option>閑魚</option>
          <option>小紅書</option>
          <option>抖音</option>
          <option>京東</option>
          <option>QQ音樂</option>
          <option>酷狗音樂</option>
          <option>網易雲</option>
          <option>拼多多</option>
          <option>阿里巴巴</option>
          <option>微博</option>
          <option>紛玩島</option>
          <option>大麥</option>
          <option>百度網盤</option>
        </select>
      </div>
    </div>
    <div class="row row-2">
      <div>
        <label>店面名稱</label>
        <input type="text" id="s_shopName">
      </div>
      <div>
        <label>訂單編號</label>
        <input type="text" id="s_orderNo">
      </div>
    </div>
    <div class="row row-2">
      <div>
        <label>周邊編號</label>
        <input type="text" id="s_goodsNo">
      </div>
      <div>
        <label>物流單號</label>
        <input type="text" id="s_logisticsNo">
      </div>
    </div>
    <div class="row row-2">
      <div>
        <label>周邊物流</label>
        <input type="text" id="s_goodsLogistics">
      </div>
      <div>
        <label>需要提確</label>
        <select id="s_needConfirm">
          <option value="否">否</option>
          <option value="是">是</option>
        </select>
      </div>
    </div>
    <div class="row row-2">
      <div>
        <label>需要二補</label>
        <select id="s_needResupply">
          <option value="否">否</option>
          <option value="是">是</option>
        </select>
      </div>
      <div>
        <label>官方發布來源</label>
        <input type="text" id="s_officialSource">
      </div>
    </div>
    <!-- 【互換】先備註、再照片 -->
    <div>
      <label>備註</label>
      <textarea id="s_note"></textarea>
    </div>
    <div style="margin:10px 0;">
      <label>照片</label>
      <div class="photo-box" id="sPhotoWrap">
        <svg viewBox="0 0 24 24"><path fill="#666" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <input type="file" accept="image/*" onchange="previewSinglePhoto(this)">
        <img id="sPhotoPreview" style="display:none;">
      </div>
      <input type="hidden" id="sPhotoBase64">
    </div>
    <div style="margin-top:10px;">
      <button class="btn" onclick="saveSingle()">儲存單品項</button>
      <button class="btn" onclick="clearSingle()">清空</button>
    </div>
  </div>
</div>

<!-- 多品項 -->
<div class="block">
  <div class="block-title" onclick="toggleBlock('multi')">多品項 <span>▼</span></div>
  <div class="block-content" id="multi">
    <div class="row row-2">
      <div>
        <label>訂購帳號</label>
        <input type="text" id="m_orderAccount">
      </div>
      <div>
        <label>訂購日期</label>
        <input type="date" id="m_orderDate">
      </div>
    </div>
    <div class="row row-2">
      <div>
        <label>人劇綜</label>
        <input type="text" id="m_artist">
      </div>
      <div>
        <label>下單平台</label>
        <select id="m_platform">
          <option value="">請選擇</option>
          <option>淘寶</option>
          <option>淘寶（騰訊）</option>
          <option>淘寶（優酷）</option>
          <option>淘寶（愛奇藝）</option>
          <option>騰訊</option>
          <option>優酷</option>
          <option>愛奇藝</option>
          <option>小芒</option>
          <option>微店</option>
          <option>微信（拼團呀）</option>
          <option>微信（拼谷）</option>
          <option>閑魚</option>
          <option>小紅書</option>
          <option>抖音</option>
          <option>京東</option>
          <option>QQ音樂</option>
          <option>酷狗音樂</option>
          <option>網易雲</option>
          <option>拼多多</option>
          <option>阿里巴巴</option>
          <option>微博</option>
          <option>紛玩島</option>
          <option>大麥</option>
          <option>百度網盤</option>
        </select>
      </div>
    </div>
    <div class="row row-2">
      <div>
        <label>店面名稱</label>
        <input type="text" id="m_shopName">
      </div>
      <div>
        <label>訂單編號</label>
        <input type="text" id="m_orderNo">
      </div>
    </div>
    <div id="productListWrap"></div>
    <button class="add-product-btn" onclick="addProductRow()">+ 新增一組商品(商品名稱/款式/數量)</button>

    <div class="section-title">金額相關</div>
    <div class="row row-3">
      <div>
        <label>實付台幣金額$</label>
        <input type="number" step="0.01" id="m_twdPay" oninput="calcFeeMulti()">
      </div>
      <div>
        <label>預計刷卡手續費$</label>
        <input type="number" id="m_fee" readonly>
      </div>
      <div>
        <label>匯率</label>
        <input type="number" step="0.0001" id="m_rate">
      </div>
    </div>
    <div class="row row-3">
      <div>
        <label>實際利潤$</label>
        <input type="number" step="0.01" id="m_profit">
      </div>
      <div>
        <label>實收台幣金額$</label>
        <input type="number" step="0.01" id="m_twdReceive">
      </div>
      <div>
        <label>付款方式</label>
        <input type="text" id="m_payWay">
      </div>
    </div>
    <div class="row row-2">
      <div>
        <label>收款來源</label>
        <input type="text" id="m_receiveSource">
      </div>
      <div>
        <label>收款日期</label>
        <input type="date" id="m_receiveDate">
      </div>
    </div>
    <div class="row row-2">
      <div>
        <label>需要提確</label>
        <select id="m_needConfirm">
          <option value="否">否</option>
          <option value="是">是</option>
        </select>
      </div>
      <div>
        <label>需要二補</label>
        <select id="m_needResupply">
          <option value="否">否</option>
          <option value="是">是</option>
        </select>
      </div>
    </div>
    <div>
      <label>官方發布來源</label>
      <input type="text" id="m_officialSource">
    </div>

    <!-- 【互換】先備註、再照片 -->
    <div>
      <label>備註</label>
      <textarea id="m_note"></textarea>
    </div>
    <div style="margin:10px 0;">
      <label>照片</label>
      <div class="photo-box" id="mPhotoWrap">
        <svg viewBox="0 0 24 24"><path fill="#666" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        <input type="file" accept="image/*" onchange="previewMultiPhoto(this)">
        <img id="mPhotoPreview" style="display:none;">
      </div>
      <input type="hidden" id="mPhotoBase64">
    </div>
    <div style="margin-top:10px;">
      <button class="btn" onclick="saveMulti()">儲存多品項</button>
      <button class="btn" onclick="clearMulti()">清空</button>
    </div>
  </div>
</div>

<!-- 儲值換匯 -->
<div class="block">
  <div class="block-title" onclick="toggleBlock('ex')">儲值換匯 <span>▼</span></div>
  <div class="block-content" id="ex">
    <div class="row row-2">
      <div>
        <label>訂購帳號</label>
        <input type="text" id="ex_orderAccount">
      </div>
      <div>
        <label>訂購日期</label>
        <input type="date" id="ex_orderDate">
      </div>
    </div>
    <div class="row row-2">
      <div>
        <label>匯率</label>
        <input type="number" step="0.0001" id="ex_rate">
      </div>
      <div>
        <label>換匯台幣</label>
        <input type="number" step="0.01" id="ex_twd">
      </div>
    </div>
    <div class="row row-2">
      <div>
        <label>換匯人民幣</label>
        <input type="number" step="0.01" id="ex_rmb">
      </div>
      <div>
        <label>備註</label>
        <input type="text" id="ex_note">
      </div>
    </div>
    <div style="margin-top:10px;">
      <button class="btn" onclick="saveEx()">儲存換匯</button>
      <button class="btn" onclick="clearEx()">清空</button>
    </div>
  </div>
</div>

<div id="recordList"></div>
</div>

<script>
// 初始化日期
const today = new Date().toISOString().split('T')[0];
document.getElementById('s_orderDate').value = today;
document.getElementById('m_orderDate').value = today;
document.getElementById('ex_orderDate').value = today;

// 折疊面板
function toggleBlock(id){
  const el = document.getElementById(id);
  el.classList.toggle('open');
}

// 手續費公式：實付台幣 ×0.015，四捨五入整數
function calcFeeSingle(){
  const twd = Number(document.getElementById('s_twdPay').value)||0;
  document.getElementById('s_fee').value = Math.round(twd * 0.015);
}
function calcFeeMulti(){
  const twd = Number(document.getElementById('m_twdPay').value)||0;
  document.getElementById('m_fee').value = Math.round(twd * 0.015);
}

// 照片預覽
function previewSinglePhoto(ipt){
  const file = ipt.files[0];if(!file)return;
  const r = new FileReader();
  r.onload=e=>{
    document.getElementById('sPhotoBase64').value=e.target.result;
    const img=document.getElementById('sPhotoPreview');
    img.src=e.target.result;img.style.display='block';
  }
  r.readAsDataURL(file);
}
function previewMultiPhoto(ipt){
  const file = ipt.files[0];if(!file)return;
  const r = new FileReader();
  r.onload=e=>{
    document.getElementById('mPhotoBase64').value=e.target.result;
    const img=document.getElementById('mPhotoPreview');
    img.src=e.target.result;img.style.display='block';
  }
  r.readAsDataURL(file);
}

// 多品項商品列
function addProductRow(data=null){
  const wrap=document.getElementById('productListWrap');
  const div=document.createElement('div');
  div.className='product-group';
  div.innerHTML=`
    <div class="row row-3">
      <div><label>商品名稱</label><input class="p-name" value="${data?.name||''}"></div>
      <div><label>款式</label><input class="p-style" value="${data?.style||''}"></div>
      <div><label>數量</label><input class="p-qty" type="number" min="1" value="${data?.qty||1}"></div>
    </div>
    <button class="btn btn-del" onclick="this.parentElement.remove()">刪除此組</button>
  `;
  wrap.appendChild(div);
}
// 預設一組商品
addProductRow();

// 讀取、儲存資料
function getRecords(){
  let raw = localStorage.getItem('buyRecords');
  if(!raw) return [];
  try{
    return JSON.parse(raw);
  }catch(e){return [];}
}
function saveRecords(arr){
  localStorage.setItem('buyRecords',JSON.stringify(arr));
}

// 舊資料相容轉換：舊單筆轉成 products:[{}]
function normalizeRecord(r){
  if(!r.products){
    r.products = [{
      name:r.goods||'',
      style:r.style||'',
      qty:r.qty||1
    }]
  }
  return r;
}

// 儲存單品項
function saveSingle(){
  const rec={
    id:Date.now(),
    type:'single',
    orderAccount:document.getElementById('s_orderAccount').value,
    orderDate:document.getElementById('s_orderDate').value,
    artist:document.getElementById('s_artist').value,
    platform:document.getElementById('s_platform').value,
    shopName:document.getElementById('s_shopName').value,
    orderNo:document.getElementById('s_orderNo').value,
    goodsNo:document.getElementById('s_goodsNo').value,
    logisticsNo:document.getElementById('s_logisticsNo').value,
    goodsLogistics:document.getElementById('s_goodsLogistics').value,
    rmbOriginal:Number(document.getElementById('s_rmbOriginal').value)||0,
    rmbPay:Number(document.getElementById('s_rmbPay').value)||0,
    twdPay:Number(document.getElementById('s_twdPay').value)||0,
    fee:Number(document.getElementById('s_fee').value)||0,
    rate:Number(document.getElementById('s_rate').value)||0,
    profit:Number(document.getElementById('s_profit').value)||0,
    twdReceive:Number(document.getElementById('s_twdReceive').value)||0,
    payWay:document.getElementById('s_payWay').value,
    receiveSource:document.getElementById('s_receiveSource').value,
    receiveDate:document.getElementById('s_receiveDate').value,
    needConfirm:document.getElementById('s_needConfirm').value,
    needResupply:document.getElementById('s_needResupply').value,
    officialSource:document.getElementById('s_officialSource').value,
    note:document.getElementById('s_note').value,
    photo:document.getElementById('sPhotoBase64').value,
    products:[{
      name:document.getElementById('s_goods').value,
      style:document.getElementById('s_style').value,
      qty:Number(document.getElementById('s_qty').value)||1
    }]
  }
  const list=getRecords();
  list.push(rec);
  saveRecords(list);
  clearSingle();
  renderList();
}
function clearSingle(){
  document.getElementById('s_orderAccount').value='';
  document.getElementById('s_orderDate').value=today;
  document.getElementById('s_artist').value='';
  document.getElementById('s_platform').value='';
  document.getElementById('s_shopName').value='';
  document.getElementById('s_orderNo').value='';
  document.getElementById('s_goodsNo').value='';
  document.getElementById('s_logisticsNo').value='';
  document.getElementById('s_goodsLogistics').value='';
  document.getElementById('s_rmbOriginal').value='';
  document.getElementById('s_rmbPay').value='';
  document.getElementById('s_twdPay').value='';
  document.getElementById('s_fee').value='';
  document.getElementById('s_rate').value='';
  document.getElementById('s_profit').value='';
  document.getElementById('s_twdReceive').value='';
  document.getElementById('s_payWay').value='';
  document.getElementById('s_receiveSource').value='';
  document.getElementById('s_receiveDate').value='';
  document.getElementById('s_needConfirm').value='否';
  document.getElementById('s_needResupply').value='否';
  document.getElementById('s_officialSource').value='';
  document.getElementById('s_note').value='';
  document.getElementById('sPhotoBase64').value='';
  document.getElementById('sPhotoPreview').style.display='none';
}

// 儲存多品項
function saveMulti(){
  const prods=[];
  document.querySelectorAll('#productListWrap .product-group').forEach(d=>{
    prods.push({
      name:d.querySelector('.p-name').value,
      style:d.querySelector('.p-style').value,
      qty:Number(d.querySelector('.p-qty').value)||1
    })
  })
  const rec={
    id:Date.now(),
    type:'multi',
    orderAccount:document.getElementById('m_orderAccount').value,
    orderDate:document.getElementById('m_orderDate').value,
    artist:document.getElementById('m_artist').value,
    platform:document.getElementById('m_platform').value,
    shopName:document.getElementById('m_shopName').value,
    orderNo:document.getElementById('m_orderNo').value,
    twdPay:Number(document.getElementById('m_twdPay').value)||0,
    fee:Number(document.getElementById('m_fee').value)||0,
    rate:Number(document.getElementById('m_rate').value)||0,
    profit:Number(document.getElementById('m_profit').value)||0,
    twdReceive:Number(document.getElementById('m_twdReceive').value)||0,
    payWay:document.getElementById('m_payWay').value,
    receiveSource:document.getElementById('m_receiveSource').value,
    receiveDate:document.getElementById('m_receiveDate').value,
    needConfirm:document.getElementById('m_needConfirm').value,
    needResupply:document.getElementById('m_needResupply').value,
    officialSource:document.getElementById('m_officialSource').value,
    note:document.getElementById('m_note').value,
    photo:document.getElementById('mPhotoBase64').value,
    products:prods
  }
  const list=getRecords();
  list.push(rec);
  saveRecords(list);
  clearMulti();
  renderList();
}
function clearMulti(){
  document.getElementById('m_orderAccount').value='';
  document.getElementById('m_orderDate').value=today;
  document.getElementById('m_artist').value='';
  document.getElementById('m_platform').value='';
  document.getElementById('m_shopName').value='';
  document.getElementById('m_orderNo').value='';
  document.getElementById('m_twdPay').value='';
  document.getElementById('m_fee').value='';
  document.getElementById('m_rate').value='';
  document.getElementById('m_profit').value='';
  document.getElementById('m_twdReceive').value='';
  document.getElementById('m_payWay').value='';
  document.getElementById('m_receiveSource').value='';
  document.getElementById('m_receiveDate').value='';
  document.getElementById('m_needConfirm').value='否';
  document.getElementById('m_needResupply').value='否';
  document.getElementById('m_officialSource').value='';
  document.getElementById('m_note').value='';
  document.getElementById('mPhotoBase64').value='';
  document.getElementById('mPhotoPreview').style.display='none';
  document.getElementById('productListWrap').innerHTML='';
  addProductRow();
}

// 儲值換匯
function saveEx(){
  const rec={
    id:Date.now(),
    type:'ex',
    orderAccount:document.getElementById('ex_orderAccount').value,
    orderDate:document.getElementById('ex_orderDate').value,
    rate:Number(document.getElementById('ex_rate').value)||0,
    twd:Number(document.getElementById('ex_twd').value)||0,
    rmb:Number(document.getElementById('ex_rmb').value)||0,
    note:document.getElementById('ex_note').value
  }
  const list=getRecords();
  list.push(rec);
  saveRecords(list);
  clearEx();
  renderList();
}
function clearEx(){
  document.getElementById('ex_orderAccount').value='';
  document.getElementById('ex_orderDate').value=today;
  document.getElementById('ex_rate').value='';
  document.getElementById('ex_twd').value='';
  document.getElementById('ex_rmb').value='';
  document.getElementById('ex_note').value='';
}

// 刪除、編輯
function delRecord(id){
  if(!confirm('確認刪除？'))return;
  let arr=getRecords().filter(x=>x.id!==id);
  saveRecords(arr);renderList();
}
function editRecord(id){
  const arr=getRecords();
  const r=normalizeRecord(arr.find(x=>x.id===id));
  if(!r)return;
  alert('編輯功能載入，後續你可自行擴充，目前已相容舊資料顯示');
}

// 渲染 + 搜尋 + 依年月分組
function renderList(){
  const kw=document.getElementById('searchInput').value.trim().toLowerCase();
  let all=getRecords().map(normalizeRecord);
  if(kw){
    all=all.filter(r=>{
      const txt = (r.artist||'')+(r.platform||'')+(r.orderNo||'')+(r.note||'')+(r.products?.map(p=>p.name+p.style).join('')||'');
      return txt.toLowerCase().includes(kw);
    })
  }
  // 分組 yyyy-MM
  const group={};
  all.forEach(r=>{
    const g = r.orderDate?.substring(0,7)||'無日期';
    if(!group[g])group[g]=[];
    group[g].push(r);
  })
  const wrap=document.getElementById('recordList');
  wrap.innerHTML='';
  Object.keys(group).sort().reverse().forEach(gkey=>{
    wrap.innerHTML += `<div class="group-title">${gkey}</div>`;
    group[gkey].forEach(r=>{
      let prodText=r.products?.map(p=>`${p.name} ${p.style} ×${p.qty}`).join('<br>')||'';
      wrap.innerHTML += `
        <div class="record-item">
          <div><b>${r.type==='single'?'單品項':r.type==='multi'?'多品項':'儲值換匯'}</b></div>
          <div>訂購帳號：${r.orderAccount||''}</div>
          <div>人劇綜：${r.artist||''}</div>
          <div>商品：${prodText}</div>
          <div>平台：${r.platform||''}</div>
          ${r.photo?`<div><img src="${r.photo}" style="max-width:120px;"></div>`:''}
          <div>備註：${r.note||''}</div>
          <button class="edit-btn" onclick="editRecord(${r.id})">編輯</button>
          <button class="edit-btn btn-del" onclick="delRecord(${r.id})">刪除</button>
        </div>
      `
    })
  })
}
document.getElementById('searchInput').addEventListener('input',renderList);
renderList();
</script>
