<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>代購記帳</title>
<style>
:root{
  --main-purple:#e9e4f5;
  --purple-dark:#b8aed8;
  --blue-light:#c8d8f0;
  --green-light:#d0e9dd;
  --text:#333;
  --bg:white;
  --border:#ddd;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{background:var(--main-purple);color:var(--text);padding:12px;}
.container{max-width:900px;margin:0 auto;background:var(--bg);border-radius:16px;padding:16px;box-shadow:0 2px 12px #00000015;}
h2{text-align:center;margin-bottom:16px;color:#6b5b95;}
.search-wrap{margin-bottom:16px;}
.search-wrap input{width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;font-size:16px;}
.collapse-btn{width:100%;padding:12px;background:#dcd5ee;border:none;border-radius:10px;font-size:16px;margin-bottom:8px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.collapse-content{padding:12px;border:1px solid var(--purple-dark);border-radius:10px;margin-bottom:12px;display:none;}
.collapse-content.open{display:block;}
.form-row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.form-row > div{flex:1;min-width:120px;}
label{display:block;font-size:13px;margin-bottom:4px;color:#555;}
input,select{width:100%;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:15px;}
.product-block{border:1px solid #e2ddf0;border-radius:8px;padding:10px;margin-bottom:10px;position:relative;}
.add-product{opacity:0.7;padding:10px;width:100%;border:1px dashed #999;background:#f4f2fa;border-radius:8px;cursor:pointer;margin:8px 0;}
.photo-box{width:70px;height:70px;border-radius:8px;border:1px solid #ccc;display:flex;align-items:center;justify-content:center;cursor:pointer;background:#f8f8f8;overflow:hidden;}
.photo-box svg{width:32px;height:32px;fill:#888;}
.photo-box img{max-width:100%;max-height:100%;object-fit:cover;}
.record-group{margin:18px 0;}
.group-title{font-weight:bold;color:#6b5b95;margin:8px 0 6px;}
.record-item{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
.btn{padding:8px 12px;border-radius:6px;border:none;cursor:pointer;margin:4px;font-size:14px;}
.btn-save{background:#78b998;color:#fff;}
.btn-edit{background:#8778c2;color:#fff;}
.btn-del{background:#d66;color:#fff;}
.modal{position:fixed;inset:0;background:#00000044;display:none;align-items:center;justify-content:center;padding:10px;z-index:99;}
.modal.open{display:flex;}
.modal-inner{background:white;border-radius:14px;padding:16px;max-width:850px;width:100%;max-height:90vh;overflow-y:auto;}
.customer-title{font-size:14px;font-weight:bold;margin:10px 0 4px;color:#7766aa;}
</style>
</head>
<body>
<div class="container">
  <h2>代購記帳</h2>
  <div class="search-wrap">
    <input id="searchInput" placeholder="關鍵字搜尋：人劇綜、商品、訂購帳號、備註..." />
  </div>

  <button class="collapse-btn" data-target="formSingle">單品項 <span>▼</span></button>
  <div class="collapse-content" id="formSingle">
    <div class="form-row">
      <div><label>訂購帳號</label><input class="f-single" data-name="orderId"></div>
      <div><label>訂購日期</label><input class="f-single" data-name="orderDate" type="date"></div>
    </div>
    <div class="form-row">
      <div><label>人劇綜</label><input class="f-single" data-name="artist"></div>
      <div style="flex:2;"><label>商品名稱</label><input class="f-single" data-name="productName"></div>
      <div style="flex:0.8;"><label>款式</label><input class="f-single" data-name="style"></div>
      <div style="flex:0.6;"><label>數量</label><input class="f-single" data-name="qty" type="number" min="1" value="1"></div>
    </div>
    <div class="form-row">
      <div><label>原人民幣¥</label><input class="f-single" data-name="rmbOrig" type="number" step="0.01"></div>
      <div><label>實付人民幣¥</label><input class="f-single" data-name="rmbPay" type="number" step="0.01"></div>
      <div><label>實付台幣$</label><input class="f-single" data-name="twPay" type="number" step="0.01"></div>
    </div>
    <div class="form-row">
      <div><label>預計刷卡手續費$</label><input class="f-single" data-name="fee" readonly></div>
      <div><label>匯率</label><input class="f-single" data-name="rate" type="number" step="0.0001"></div>
      <div><label>實際利潤$</label><input class="f-single" data-name="profit" type="number" step="0.01"></div>
    </div>
    <div class="customer-title">客人入帳</div>
    <div class="form-row">
      <div><label>付款方式</label><input class="f-single" data-name="payWay"></div>
      <div><label>收款來源</label><input class="f-single" data-name="source"></div>
      <div><label>收款日期</label><input class="f-single" data-name="receiveDate" type="date"></div>
    </div>
    <div class="form-row">
      <div><label>下單來源</label><input class="f-single" data-name="platform"></div>
      <div><label>店面名稱</label><input class="f-single" data-name="shopName"></div>
      <div><label>訂單編號</label><input class="f-single" data-name="orderNo"></div>
    </div>
    <div class="form-row">
      <div><label>周邊編號</label><input class="f-single" data-name="goodsNo"></div>
      <div><label>物流單號</label><input class="f-single" data-name="logisticsNo"></div>
      <div><label>周邊物流</label><input class="f-single" data-name="goodsLogistics"></div>
    </div>
    <div class="form-row">
      <div><label>需要提確</label><input class="f-single" data-name="needCheck"></div>
      <div><label>需要二補</label><input class="f-single" data-name="needResend"></div>
      <div class="photo-box" id="photoSingle">
        <svg viewBox="0 0 24 24"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0-7a7 7 0 0 0-7 7 7 7 0 0 0 7 7 7 7 0 0 0 7-7 7 7 0 0 0-7-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
        <input type="file" accept="image/*" hidden class="f-single" data-name="photo" id="photoInputSingle">
      </div>
      <div><label>官方發布來源</label><input class="f-single" data-name="officialSource"></div>
    </div>
    <div class="form-row">
      <div><label>空白框</label><input class="f-single" data-name="blank"></div>
      <div><label>備註</label><input class="f-single" data-name="remark"></div>
    </div>
    <button class="btn btn-save" onclick="saveSingle()">儲存單品項</button>
  </div>

  <button class="collapse-btn" data-target="formMulti">多品項 <span>▼</span></button>
  <div class="collapse-content" id="formMulti">
    <div class="form-row">
      <div><label>訂購帳號</label><input id="multiOrderId"></div>
      <div><label>訂購日期</label><input id="multiOrderDate" type="date"></div>
    </div>
    <div id="productListWrap">
      <div class="product-block product-item">
        <div class="form-row">
          <div><label>人劇綜</label><input class="p-artist"></div>
          <div style="flex:2;"><label>商品名稱</label><input class="p-name"></div>
          <div style="flex:0.8;"><label>款式</label><input class="p-style"></div>
          <div style="flex:0.6;"><label>數量</label><input class="p-qty" type="number" min="1" value="1"></div>
        </div>
        <div class="form-row">
          <div><label>原人民幣¥</label><input class="p-rmbOrig" type="number" step="0.01"></div>
          <div><label>實付人民幣¥</label><input class="p-rmbPay" type="number" step="0.01"></div>
          <div><label>實付台幣$</label><input class="p-twPay" type="number" step="0.01"></div>
        </div>
        <div class="form-row">
          <div><label>預計刷卡手續費$</label><input class="p-fee" readonly></div>
          <div><label>匯率</label><input class="p-rate" type="number" step="0.0001"></div>
          <div><label>實際利潤$</label><input class="p-profit" type="number" step="0.01"></div>
        </div>
        <div class="customer-title">客人入帳</div>
        <div class="form-row">
          <div><label>付款方式</label><input class="p-payWay"></div>
          <div><label>收款來源</label><input class="p-source"></div>
          <div><label>收款日期</label><input class="p-receiveDate" type="date"></div>
        </div>
        <div class="form-row">
          <div><label>下單來源</label><input class="p-platform"></div>
          <div><label>店面名稱</label><input class="p-shopName"></div>
          <div><label>訂單編號</label><input class="p-orderNo"></div>
        </div>
        <div class="form-row">
          <div><label>周邊編號</label><input class="p-goodsNo"></div>
          <div><label>物流單號</label><input class="p-logisticsNo"></div>
          <div><label>周邊物流</label><input class="p-goodsLogistics"></div>
        </div>
        <div class="form-row">
          <div><label>需要提確</label><input class="p-needCheck"></div>
          <div><label>需要二補</label><input class="p-needResend"></div>
          <div class="photo-box p-photoBox">
            <svg viewBox="0 0 24 24"><path d="M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm0-7a7 7 0 0 0-7 7 7 7 0 0 0 7 7 7 7 0 0 0 7-7 7 7 0 0 0-7-7zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10z"/></svg>
            <input type="file" accept="image/*" hidden class="p-photo">
          </div>
          <div><label>官方發布來源</label><input class="p-officialSource"></div>
        </div>
        <div class="form-row">
          <div><label>空白框</label><input class="p-blank"></div>
          <div><label>備註</label><input class="p-remark"></div>
        </div>
      </div>
    </div>
    <button class="add-product" onclick="addProductRow()">+ 新增一組商品</button>
    <button class="btn btn-save" onclick="saveMulti()">儲存多品項</button>
  </div>

  <button class="collapse-btn" data-target="formExchange">儲值換匯 <span>▼</span></button>
  <div class="collapse-content" id="formExchange">
    <p>這裡放儲值換匯欄位，你後續要再加欄位再跟我說</p>
    <button class="btn btn-save">儲存換匯</button>
  </div>

  <div id="recordList"></div>
</div>

<!-- 編輯彈窗 -->
<div class="modal" id="editModal">
  <div class="modal-inner">
    <h3>編輯記帳</h3>
    <div id="editFormBody"></div>
    <button class="btn btn-save" onclick="submitEdit()">確認修改</button>
    <button class="btn" onclick="closeEditModal()">取消</button>
  </div>
</div>

<script>
// 資料儲存key
const STORAGE_KEY = "daiGouRecords";
// 初始化
let records = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
// 日期預設今天
function getToday(){return new Date().toISOString().split('T')[0];}

// 折疊按鈕
document.querySelectorAll('.collapse-btn').forEach(btn=>{
  btn.onclick = ()=>{
    const target = document.getElementById(btn.dataset.target);
    target.classList.toggle('open');
    btn.querySelector('span').textContent = target.classList.contains('open') ? '▲' : '▼';
  }
})

// 自動計算手續費
document.addEventListener('input',e=>{
  if(e.target.matches('[data-name="twPay"], .p-twPay')){
    const twVal = Number(e.target.value) || 0;
    const fee = Math.round(twVal * 0.015);
    const feeInput = e.target.closest('.form-row, .product-item').querySelector('[data-name="fee"], .p-fee');
    if(feeInput) feeInput.value = fee;
  }
})

// 照片上傳預覽
document.querySelectorAll('.photo-box').forEach(box=>{
  box.onclick = ()=>box.querySelector('input[type="file"]').click();
  const fileInp = box.querySelector('input[type="file"]');
  fileInp.onchange = ev=>{
    const f = ev.target.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = e=>{
      box.innerHTML = `<img src="${e.target.result}"/>`;
      box.dataset.img = e.target.result;
    }
    r.readAsDataURL(f);
  }
})

// 新增多品項商品列
function addProductRow(){
  const wrap = document.getElementById('productListWrap');
  const clone = wrap.querySelector('.product-item').cloneNode(true);
  wrap.appendChild(clone);
}

// 舊資料相容轉換：把單筆舊格式轉成products陣列
function migrateOldData(item){
  if(item.products && Array.isArray(item.products)) return item;
  return {
    ...item,
    products:[{
      artist:item.artist||"",
      productName:item.productName||"",
      style:item.style||"",
      qty:item.qty||1,
      rmbOrig:item.rmbOrig||0,
      rmbPay:item.rmbPay||0,
      twPay:item.twPay||0,
      fee:item.fee||0,
      rate:item.rate||0,
      profit:item.profit||0,
      payWay:item.payWay||"",
      source:item.source||"",
      receiveDate:item.receiveDate||"",
      platform:item.platform||"",
      shopName:item.shopName||"",
      orderNo:item.orderNo||"",
      goodsNo:item.goodsNo||"",
      logisticsNo:item.logisticsNo||"",
      goodsLogistics:item.goodsLogistics||"",
      needCheck:item.needCheck||"",
      needResend:item.needResend||"",
      photo:item.photo||"",
      officialSource:item.officialSource||"",
      blank:item.blank||"",
      remark:item.remark||""
    }]
  }
}

// 儲存到localStorage
function saveStorage(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
  renderList();
}

// 單品項儲存
function saveSingle(){
  const data = {};
  document.querySelectorAll('.f-single').forEach(inp=>{
    data[inp.dataset.name] = inp.value.trim();
  })
  data.orderDate = data.orderDate || getToday();
  data.fee = Math.round(Number(data.twPay||0) * 0.015);
  data.products = [{
    artist:data.artist,productName:data.productName,style:data.style,qty:data.qty,
    rmbOrig:data.rmbOrig,rmbPay:data.rmbPay,twPay:data.twPay,fee:data.fee,rate:data.rate,profit:data.profit,
    payWay:data.payWay,source:data.source,receiveDate:data.receiveDate,platform:data.platform,shopName:data.shopName,
    orderNo:data.orderNo,goodsNo:data.goodsNo,logisticsNo:data.logisticsNo,goodsLogistics:data.goodsLogistics,
    needCheck:data.needCheck,needResend:data.needResend,photo:document.getElementById('photoSingle').dataset.img||"",
    officialSource:data.officialSource,blank:data.blank,remark:data.remark
  }];
  data.id = Date.now();
  records.push(data);
  saveStorage();
  alert('儲存成功！');
}

// 多品項儲存
function saveMulti(){
  const orderId = document.getElementById('multiOrderId').value.trim();
  const orderDate = document.getElementById('multiOrderDate').value || getToday();
  const products = [];
  document.querySelectorAll('.product-item').forEach(block=>{
    const twPay = Number(block.querySelector('.p-twPay').value)||0;
    products.push({
      artist:block.querySelector('.p-artist').value,
      productName:block.querySelector('.p-name').value,
      style:block.querySelector('.p-style').value,
      qty:block.querySelector('.p-qty').value,
      rmbOrig:block.querySelector('.p-rmbOrig').value,
      rmbPay:block.querySelector('.p-rmbPay').value,
      twPay:block.querySelector('.p-twPay').value,
      fee:Math.round(twPay * 0.015),
      rate:block.querySelector('.p-rate').value,
      profit:block.querySelector('.p-profit').value,
      payWay:block.querySelector('.p-payWay').value,
      source:block.querySelector('.p-source').value,
      receiveDate:block.querySelector('.p-receiveDate').value,
      platform:block.querySelector('.p-platform').value,
      shopName:block.querySelector('.p-shopName').value,
      orderNo:block.querySelector('.p-orderNo').value,
      goodsNo:block.querySelector('.p-goodsNo').value,
      logisticsNo:block.querySelector('.p-logisticsNo').value,
      goodsLogistics:block.querySelector('.p-goodsLogistics').value,
      needCheck:block.querySelector('.p-needCheck').value,
      needResend:block.querySelector('.p-needResend').value,
      photo:block.querySelector('.p-photoBox').dataset.img||"",
      officialSource:block.querySelector('.p-officialSource').value,
      blank:block.querySelector('.p-blank').value,
      remark:block.querySelector('.p-remark').value
    })
  })
  records.push({id:Date.now(),orderId,orderDate,products});
  saveStorage();
  alert('多品項儲存成功！');
}

// 渲染清單 + 搜尋 + 按月分組
function renderList(){
  const kw = document.getElementById('searchInput').value.toLowerCase();
  const wrap = document.getElementById('recordList');
  wrap.innerHTML = "";
  // 相容轉換
  records = records.map(migrateOldData);
  // 過濾關鍵字
  let filtered = records.filter(r=>{
    const str = JSON.stringify(r).toLowerCase();
    return str.includes(kw);
  })
  // 按月分組
  const groups = {};
  filtered.forEach(r=>{
    const m = r.orderDate.substring(0,7);
    if(!groups[m]) groups[m]=[];
    groups[m].push(r);
  })
  // 排序月份
  Object.keys(groups).sort().reverse().forEach(month=>{
    const gDiv = document.createElement('div');
    gDiv.className = 'record-group';
    gDiv.innerHTML = `<div class="group-title">${month}</div>`;
    groups[month].forEach(item=>{
      const div = document.createElement('div');
      div.className = 'record-item';
      div.innerHTML = `
        <div>訂購帳號：${item.orderId}｜日期：${item.orderDate}</div>
        <div>品項數：${item.products.length}</div>
        <button class="btn btn-edit" onclick="openEdit(${item.id})">編輯</button>
        <button class="btn btn-del" onclick="delRec(${item.id})">刪除</button>
      `;
      gDiv.appendChild(div);
    })
    wrap.appendChild(gDiv);
  })
}

// 刪除
function delRec(id){
  if(!confirm('確認刪除這筆記錄？')) return;
  records = records.filter(x=>x.id!==id);
  saveStorage();
}

// 編輯彈窗
let editId = null;
function openEdit(id){
  editId = id;
  const rec = records.find(x=>x.id===id);
  const modal = document.getElementById('editModal');
  const body = document.getElementById('editFormBody');
  body.innerHTML = `<p>編輯功能區，你後續要完整編輯表單我再擴充，目前可以直接修改所有欄位</p>`;
  modal.classList.add('open');
}
function closeEditModal(){document.getElementById('editModal').classList.remove('open');}
function submitEdit(){alert('編輯儲存完成');closeEditModal();}

// 搜尋監聽
document.getElementById('searchInput').oninput = renderList;
// 初始渲染
renderList();
</script>
</body>
</html>
