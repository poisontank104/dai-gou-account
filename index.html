<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>代購記帳</title>
<style>
:root{
  --main-purple:#e9e4f5;
  --purple-dark:#b8aed8;
  --blue-light:#c8d8f0;
  --green-light:#d0e9dd;
  --text:#333;
  --bg:white;
  --border:#ddd;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{background:var(--main-purple);color:var(--text);padding:12px;}
.container{max-width:900px;margin:0 auto;background:var(--bg);border-radius:16px;padding:16px;box-shadow:0 2px 10px #00000015;}
h2{text-align:center;margin-bottom:16px;color:#7766aa;}
.panel{border:1px solid var(--border);border-radius:12px;margin-bottom:12px;overflow:hidden;}
.panel-header{padding:12px;background:#f3f0fa;cursor:pointer;font-weight:bold;display:flex;justify-content:space-between;align-items:center;}
.panel-body{padding:12px;display:none;}
.panel-body.open{display:block;}
.row{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.form-item{flex:1;min-width:140px;}
.form-item.wide{flex:2;}
label{display:block;font-size:13px;margin-bottom:4px;color:#555;}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:14px;}
textarea{resize:vertical;min-height:70px;}
.btn{padding:9px 14px;border:none;border-radius:8px;background:#b8aed8;color:#fff;cursor:pointer;font-weight:500;margin:4px;}
.btn-del{background:#dd7777;}
.btn-add{background:#88b899;}
.product-block{border:1px solid #eee;border-radius:10px;padding:10px;margin:8px 0;}
.photo-box{width:80px;height:80px;border:1px dashed #aaa;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#888;font-size:24px;overflow:hidden;background:#fafafa;}
.photo-box img{max-width:100%;max-height:100%;object-fit:cover;}
.photo-input{display:none;}
.search-bar{margin:12px 0;}
.record-group{margin:14px 0;border-left:4px solid #b8aed8;padding-left:10px;}
.record-card{border:1px solid #eee;border-radius:10px;padding:10px;margin:8px 0;position:relative;}
.record-card button{font-size:12px;padding:4px 8px;margin:2px;}
.stats-area{margin-top:20px;padding-top:12px;border-top:1px solid #ddd;}
</style>
</head>
<body>
<div class="container">
<h2>代購記帳</h2>

<div class="search-bar">
<label>關鍵字搜尋</label>
<input id="searchInput" placeholder="搜尋藝人、商品、訂單編號、平台..." oninput="renderList()">
</div>

<!-- 單品項 -->
<div class="panel">
  <div class="panel-header" onclick="togglePanel('singlePanel')">單品項 <span>▼</span></div>
  <div class="panel-body" id="singlePanel">
    <div class="row">
      <div class="form-item"><label>訂購帳號</label><input id="s_orderAcc" type="text"></div>
      <div class="form-item"><label>訂購日期</label><input id="s_orderDate" type="date"></div>
    </div>
    <div class="row">
      <div class="form-item"><label>人劇綜</label><input id="s_artist" type="text"></div>
      <div class="form-item wide"><label>商品名稱</label><input id="s_goods" type="text"></div>
      <div class="form-item"><label>款式</label><input id="s_style" type="text"></div>
      <div class="form-item"><label>數量</label><input id="s_qty" type="number" min="1" value="1"></div>
    </div>
    <div class="row">
      <div class="form-item"><label>原金額¥</label><input id="s_rmbOrig" type="number" step="0.01"></div>
      <div class="form-item"><label>實付金額¥</label><input id="s_rmbPay" type="number" step="0.01"></div>
      <div class="form-item"><label>實付台幣$</label><input id="s_twdPay" type="number" step="0.01" oninput="calcFee('s')"></div>
    </div>
    <div class="row">
      <div class="form-item"><label>預計刷卡手續費$</label><input id="s_fee" type="number" readonly></div>
      <div class="form-item"><label>匯率</label><input id="s_rate" type="number" step="0.0001"></div>
      <div class="form-item"><label>實際利潤$</label><input id="s_profit" type="number" step="0.01"></div>
    </div>
    <div style="margin:8px 0;"><b>客人入帳</b></div>
    <div class="row">
      <div class="form-item"><label>付款方式</label><input id="s_payWay" type="text"></div>
      <div class="form-item"><label>收款來源</label><input id="s_rcvSource" type="text"></div>
      <div class="form-item"><label>收款日期</label><input id="s_rcvDate" type="date"></div>
    </div>
    <div class="row">
      <div class="form-item"><label>下單平台</label>
        <select id="s_platform" onchange="platformChange('s')"></select>
      </div>
      <div class="form-item" id="s_platformOtherWrap" style="display:none">
        <label>自訂平台</label><input id="s_platformOther" type="text">
      </div>
      <div class="form-item"><label>店面名稱</label><input id="s_shopName" type="text"></div>
    </div>
    <div class="row">
      <div class="form-item"><label>訂單編號</label><input id="s_orderNo" type="text"></div>
      <div class="form-item"><label>周邊編號</label><input id="s_goodsNo" type="text"></div>
      <div class="form-item"><label>物流單號</label><input id="s_logiNo" type="text"></div>
      <div class="form-item"><label>周邊物流</label><input id="s_logiName" type="text"></div>
    </div>
    <div class="row">
      <div class="form-item"><label>需要二補</label><select id="s_need2"><option value="否">否</option><option value="是">是</option></select></div>
      <div class="form-item"><label>官方發布來源</label><input id="s_officialSrc" type="text"></div>
    </div>
    <!-- 備註放前面、照片放後面（互換） -->
    <div class="row">
      <div class="form-item wide">
        <label>備註</label><textarea id="s_note"></textarea>
      </div>
      <div class="form-item">
        <label>照片</label>
        <div class="photo-box" onclick="document.getElementById('s_photo').click()">📷</div>
        <input type="file" id="s_photo" class="photo-input" accept="image/*" onchange="previewPhoto('s')">
        <img id="s_photoPrev" style="max-width:100%;margin-top:4px;display:none;">
      </div>
    </div>
    <button class="btn" onclick="saveSingle()">儲存單品項</button>
  </div>
</div>

<!-- 多品項 -->
<div class="panel">
  <div class="panel-header" onclick="togglePanel('multiPanel')">多品項 <span>▼</span></div>
  <div class="panel-body" id="multiPanel">
    <div class="row">
      <div class="form-item"><label>訂購帳號</label><input id="m_orderAcc" type="text"></div>
      <div class="form-item"><label>訂購日期</label><input id="m_orderDate" type="date"></div>
    </div>
    <div id="multiProductWrap"></div>
    <button class="btn btn-add" onclick="addMultiProduct()">+新增商品組</button>
    <div style="margin:8px 0;"><b>客人入帳</b></div>
    <div class="row">
      <div class="form-item"><label>付款方式</label><input id="m_payWay" type="text"></div>
      <div class="form-item"><label>收款來源</label><input id="m_rcvSource" type="text"></div>
      <div class="form-item"><label>收款日期</label><input id="m_rcvDate" type="date"></div>
    </div>
    <div class="row">
      <div class="form-item"><label>下單平台</label>
        <select id="m_platform" onchange="platformChange('m')"></select>
      </div>
      <div class="form-item" id="m_platformOtherWrap" style="display:none">
        <label>自訂平台</label><input id="m_platformOther" type="text">
      </div>
      <div class="form-item"><label>店面名稱</label><input id="m_shopName" type="text"></div>
    </div>
    <div class="row">
      <div class="form-item"><label>訂單編號</label><input id="m_orderNo" type="text"></div>
      <div class="form-item"><label>周邊編號</label><input id="m_goodsNo" type="text"></div>
      <div class="form-item"><label>物流單號</label><input id="m_logiNo" type="text"></div>
      <div class="form-item"><label>周邊物流</label><input id="m_logiName" type="text"></div>
    </div>
    <div class="row">
      <div class="form-item"><label>需要二補</label><select id="m_need2"><option value="否">否</option><option value="是">是</option></select></div>
      <div class="form-item"><label>官方發布來源</label><input id="m_officialSrc" type="text"></div>
    </div>
    <!-- 備註、照片互換 -->
    <div class="row">
      <div class="form-item wide">
        <label>備註</label><textarea id="m_note"></textarea>
      </div>
      <div class="form-item">
        <label>照片</label>
        <div class="photo-box" onclick="document.getElementById('m_photo').click()">📷</div>
        <input type="file" id="m_photo" class="photo-input" accept="image/*" onchange="previewPhoto('m')">
        <img id="m_photoPrev" style="max-width:100%;margin-top:4px;display:none;">
      </div>
    </div>
    <button class="btn" onclick="saveMulti()">儲存多品項</button>
  </div>
</div>

<!-- 儲值換匯 -->
<div class="panel">
  <div class="panel-header" onclick="togglePanel('exPanel')">儲值換匯 <span>▼</span></div>
  <div class="panel-body" id="exPanel">
    <div class="row">
      <div class="form-item"><label>訂購日期</label><input id="ex_date" type="date"></div>
      <div class="form-item"><label>金額</label><input id="ex_amt" type="number" step="0.01"></div>
      <div class="form-item"><label>匯率</label><input id="ex_rate" type="number" step="0.0001"></div>
    </div>
    <div class="row">
      <div class="form-item"><label>備註</label><textarea id="ex_note"></textarea></div>
    </div>
    <button class="btn" onclick="saveEx()">儲存換匯</button>
  </div>
</div>

<div id="listWrap"></div>
<div class="stats-area">
  <h4>彙整區間</h4>
  <div id="statsWrap"></div>
</div>
</div>

<script>
// 預設平台清單
const defaultPlatformList = [
  "淘寶","淘寶（騰訊）","淘寶（優酷）","淘寶（愛奇藝）","騰訊","優酷","愛奇藝",
  "小芒","微店","微信（拼團呀）","微信（拼谷）","閑魚","小紅書","抖音","京東",
  "QQ音樂","酷狗音樂","網易雲","拼多多","阿里巴巴","微博","紛玩島","大麥","百度網盤"
];
let platformList = [];
let records = [];

// 初始化
function init(){
  loadData();
  renderPlatformSelect();
  renderList();
  setDefaultDate();
  addMultiProduct();
}
function loadData(){
  const rawRec = localStorage.getItem("dg_records");
  const rawPlat = localStorage.getItem("dg_platforms");
  if(rawRec) records = JSON.parse(rawRec);
  if(rawPlat) platformList = JSON.parse(rawPlat);
  // 合併預設 + 自訂，去重
  platformList = [...new Set([...defaultPlatformList,...platformList])];
  savePlatformList();
}
function saveRecords(){
  localStorage.setItem("dg_records", JSON.stringify(records));
}
function savePlatformList(){
  localStorage.setItem("dg_platforms", JSON.stringify(platformList));
}
function renderPlatformSelect(){
  const selS = document.getElementById("s_platform");
  const selM = document.getElementById("m_platform");
  selS.innerHTML = ""; selM.innerHTML = "";
  [...platformList, "其他"].forEach(p=>{
    selS.innerHTML += `<option value="${p}">${p}</option>`;
    selM.innerHTML += `<option value="${p}">${p}</option>`;
  })
}
function platformChange(type){
  const sel = document.getElementById(type+"_platform");
  const otherWrap = document.getElementById(type+"_platformOtherWrap");
  otherWrap.style.display = sel.value === "其他" ? "block" : "none";
}
// 新增自訂平台（儲存時自動加入）
function addCustomPlatform(name){
  if(!name || platformList.includes(name)) return;
  platformList.push(name);
  savePlatformList();
  renderPlatformSelect();
}

function togglePanel(id){
  const el = document.getElementById(id);
  el.classList.toggle("open");
}
function setDefaultDate(){
  const d = new Date().toISOString().split("T")[0];
  document.getElementById("s_orderDate").value = d;
  document.getElementById("m_orderDate").value = d;
  document.getElementById("ex_date").value = d;
}
// 手續費公式：實付台幣 ×0.015 四捨五入整數
function calcFee(type){
  const twd = Number(document.getElementById(type+"_twdPay").value||0);
  const fee = Math.round(twd * 0.015);
  document.getElementById(type+"_fee").value = fee;
}

// 多品項商品組
function addMultiProduct(){
  const wrap = document.getElementById("multiProductWrap");
  const div = document.createElement("div");
  div.className = "product-block";
  div.innerHTML = `
  <div class="row">
    <div class="form-item"><label>人劇綜</label><input class="m-art" type="text"></div>
    <div class="form-item wide"><label>商品名稱</label><input class="m-goods" type="text"></div>
    <div class="form-item"><label>款式</label><input class="m-style" type="text"></div>
    <div class="form-item"><label>數量</label><input class="m-qty" type="number" min="1" value="1"></div>
  </div>
  <div class="row">
    <div class="form-item"><label>原金額¥</label><input class="m-rmbOrig" type="number" step="0.01"></div>
    <div class="form-item"><label>實付金額¥</label><input class="m-rmbPay" type="number" step="0.01"></div>
    <div class="form-item"><label>實付台幣$</label><input class="m-twdPay" type="number" step="0.01" oninput="calcMultiFee(this)"></div>
    <div class="form-item"><label>預計刷卡手續費$</label><input class="m-fee" type="number" readonly></div>
  </div>
  <button class="btn btn-del" onclick="this.parentElement.remove()">刪除這組商品</button>
  `;
  wrap.appendChild(div);
}
function calcMultiFee(inputEl){
  const twd = Number(inputEl.value||0);
  const fee = Math.round(twd * 0.015);
  inputEl.parentElement.querySelector(".m-fee").value = fee;
}

// 照片預覽
function previewPhoto(type){
  const file = document.getElementById(type+"_photo").files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload=e=>{
    const img = document.getElementById(type+"_photoPrev");
    img.src = e.target.result;
    img.style.display="block";
  }
  r.readAsDataURL(file);
}

// 儲存單品項
function saveSingle(){
  let plat = document.getElementById("s_platform").value;
  if(plat === "其他") plat = document.getElementById("s_platformOther").value.trim();
  addCustomPlatform(plat);
  const rec = {
    id: Date.now(),
    type:"single",
    orderAcc:document.getElementById("s_orderAcc").value,
    orderDate:document.getElementById("s_orderDate").value,
    artist:document.getElementById("s_artist").value,
    goods:document.getElementById("s_goods").value,
    style:document.getElementById("s_style").value,
    qty:document.getElementById("s_qty").value,
    rmbOrig:document.getElementById("s_rmbOrig").value,
    rmbPay:document.getElementById("s_rmbPay").value,
    twdPay:document.getElementById("s_twdPay").value,
    fee:document.getElementById("s_fee").value,
    rate:document.getElementById("s_rate").value,
    profit:document.getElementById("s_profit").value,
    payWay:document.getElementById("s_payWay").value,
    rcvSource:document.getElementById("s_rcvSource").value,
    rcvDate:document.getElementById("s_rcvDate").value,
    platform:plat,
    shopName:document.getElementById("s_shopName").value,
    orderNo:document.getElementById("s_orderNo").value,
    goodsNo:document.getElementById("s_goodsNo").value,
    logiNo:document.getElementById("s_logiNo").value,
    logiName:document.getElementById("s_logiName").value,
    need2:document.getElementById("s_need2").value,
    officialSrc:document.getElementById("s_officialSrc").value,
    note:document.getElementById("s_note").value,
    photo:document.getElementById("s_photoPrev").src || ""
  };
  records.push(rec);
  saveRecords();
  renderList();
  alert("儲存成功！");
}
// 儲存多品項
function saveMulti(){
  let plat = document.getElementById("m_platform").value;
  if(plat === "其他") plat = document.getElementById("m_platformOther").value.trim();
  addCustomPlatform(plat);
  const productBlocks = document.querySelectorAll("#multiProductWrap .product-block");
  const products = [];
  productBlocks.forEach(b=>{
    products.push({
      artist:b.querySelector(".m-art").value,
      goods:b.querySelector(".m-goods").value,
      style:b.querySelector(".m-style").value,
      qty:b.querySelector(".m-qty").value,
      rmbOrig:b.querySelector(".m-rmbOrig").value,
      rmbPay:b.querySelector(".m-rmbPay").value,
      twdPay:b.querySelector(".m-twdPay").value,
      fee:b.querySelector(".m-fee").value
    })
  })
  const rec = {
    id: Date.now(),
    type:"multi",
    orderAcc:document.getElementById("m_orderAcc").value,
    orderDate:document.getElementById("m_orderDate").value,
    products:products,
    payWay:document.getElementById("m_payWay").value,
    rcvSource:document.getElementById("m_rcvSource").value,
    rcvDate:document.getElementById("m_rcvDate").value,
    platform:plat,
    shopName:document.getElementById("m_shopName").value,
    orderNo:document.getElementById("m_orderNo").value,
    goodsNo:document.getElementById("m_goodsNo").value,
    logiNo:document.getElementById("m_logiNo").value,
    logiName:document.getElementById("m_logiName").value,
    need2:document.getElementById("m_need2").value,
    officialSrc:document.getElementById("m_officialSrc").value,
    note:document.getElementById("m_note").value,
    photo:document.getElementById("m_photoPrev").src || ""
  };
  records.push(rec);
  saveRecords();
  renderList();
  alert("儲存成功！");
}
function saveEx(){
  const rec = {
    id: Date.now(),
    type:"ex",
    orderDate:document.getElementById("ex_date").value,
    amt:document.getElementById("ex_amt").value,
    rate:document.getElementById("ex_rate").value,
    note:document.getElementById("ex_note").value
  };
  records.push(rec);
  saveRecords();
  renderList();
  alert("儲存成功！");
}

// 渲染清單 + 月份分組 + 搜尋
function renderList(){
  const kw = document.getElementById("searchInput").value.toLowerCase();
  const wrap = document.getElementById("listWrap");
  let filtered = records.filter(r=>{
    const txt = JSON.stringify(r).toLowerCase();
    return txt.includes(kw);
  })
  // 按月分組
  const groups = {};
  filtered.forEach(r=>{
    const m = r.orderDate?.substring(0,7) || "未分類";
    if(!groups[m]) groups[m]=[];
    groups[m].push(r);
  })
  let html = "";
  Object.keys(groups).sort().reverse().forEach(m=>{
    html += `<div class="record-group"><h4>${m}</h4>`;
    groups[m].forEach(r=>{
      html += buildRecordCard(r);
    })
    html += "</div>";
  })
  wrap.innerHTML = html;
}
function buildRecordCard(r){
  let inner = "";
  if(r.type==="single"){
    inner = `
      <div>帳號：${r.orderAcc}｜人劇綜：${r.artist}｜商品：${r.goods}</div>
      <div>平台：${r.platform}｜訂單：${r.orderNo}</div>
      <div>備註：${r.note||""}</div>
      ${r.photo?`<img src="${r.photo}" style="max-width:120px;">`:""}
    `
  }else if(r.type==="multi"){
    inner = `<div>帳號：${r.orderAcc}｜平台：${r.platform}</div>`;
    r.products?.forEach(p=>{
      inner += `<div>▪ ${p.artist}｜${p.goods} ${p.style} ×${p.qty}</div>`
    })
    inner += `<div>備註：${r.note||""}</div>${r.photo?`<img src="${r.photo}" style="max-width:120px;">`:""}`
  }else{
    inner = `<div>換匯｜金額${r.amt} 匯率${r.rate}｜備註：${r.note}</div>`
  }
  return `
  <div class="record-card">
    ${inner}
    <button class="btn" onclick="editRec(${r.id})">編輯</button>
    <button class="btn btn-del" onclick="delRec(${r.id})">刪除</button>
  </div>
  `
}
function delRec(id){
  if(!confirm("確認刪除？"))return;
  records = records.filter(x=>x.id!==id);
  saveRecords();renderList();
}
function editRec(id){
  alert("編輯功能這版先保留基礎架構，如需要我再補完整編輯表單回填");
}
init();
</script>
</body>
</html>
