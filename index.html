<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>代購記帳</title>
<style>
:root{
  --main-purple:#e9e4f5;
  --purple-dark:#b8aed8;
  --blue-light:#c8d8f0;
  --yellow-light:#fff4cc;
  --text:#333;
  --bg:white;
  --border:#ddd;
  --orange-deep:#d49b78;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{background:var(--main-purple);color:var(--text);padding:12px;}
.container{max-width:900px;margin:0 auto;background:var(--bg);border-radius:16px;padding:16px;box-shadow:0 2px 8px #00000012;}
h1{text-align:center;margin-bottom:16px;color:#7b68a8;font-size:22px;}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.stat-card{padding:12px;border-radius:12px;background:var(--main-purple);text-align:center;font-weight:bold;}
.search-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:10px;border:1px solid #eee;border-radius:10px;position:relative;}
.search-wrap{position:relative;flex:1;}
.search-wrap input{padding-right:32px !important;}
.search-clear-x{
  position:absolute;
  right:8px;
  top:50%;
  transform:translateY(-50%);
  border:none;
  background:transparent;
  font-size:18px;
  color:#888;
  cursor:pointer;
  padding:0 4px;
}
.single-collapse{margin-bottom:10px;border:1px solid #eee;border-radius:10px;overflow:hidden;}
.single-collapse-header{padding:10px 14px;cursor:pointer;font-weight:bold;display:flex;justify-content:space-between;align-items:center;}
#header-single{background:#d9d0ee;}
#header-multi{background:var(--blue-light);}
#header-exch{background:var(--yellow-light);}
.single-collapse-content{padding:12px;display:none;}
.single-collapse-content.open{display:block;}
.btn-group{display:flex;gap:8px;flex-wrap:wrap;}
.btn-group .btn-full{
  flex:1;
  background:var(--orange-deep);
  color:white;
}
button{padding:10px 14px;border:none;border-radius:10px;cursor:pointer;font-size:15px;}
.filter-bar{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:12px;border-top:1px solid #eee;}
.filter-content{display:none;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;}
.filter-content.open{display:flex;}
.form-wrap{display:none;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px;}
.form-wrap.active{display:block;}
.form-row{display:grid;gap:10px;margin-bottom:10px;align-items:end;}
.row-2col{grid-template-columns:1fr 1fr;}
.row-4col{grid-template-columns:1.2fr 2fr 0.8fr 0.8fr;}
.row-3col{grid-template-columns:1fr 1fr 1fr;}
.row-4short{grid-template-columns:1fr 1fr 1fr 1fr;}
label{font-size:14px;display:block;margin-bottom:4px;}
input,select{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:15px;}
input[type="number"]{inputmode:decimal;}
input.no-spin::-webkit-outer-spin-button,
input.no-spin::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input.no-spin {
  -moz-appearance: textfield;
}
.auto-suggest{position:relative;}
.suggest-list{position:absolute;background:white;border:1px solid #ddd;border-radius:0 0 8px 8px;z-index:99;top:100%;left:0;right:0;max-height:160px;overflow-y:auto;display:none;}
.suggest-item{padding:8px 10px;cursor:pointer;}
.suggest-item:hover{background:#f2f0fa;}
.photo-area{margin:10px 0;}
.camera-upload-box{
  width:80px;
  height:80px;
  border:1.5px dashed #b8aed8;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
  font-size:28px;
  color:#7b68a8;
  background:#f9f7ff;
  flex-shrink:0;
}
.camera-upload-box input{ display:none; }
.photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center;}
.photo-preview img{width:80px;height:80px;object-fit:cover;border-radius:6px;}
.item-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;}
th,td{border:1px solid #eee;padding:8px;text-align:left;}
th{background:var(--main-purple);}
.sub-title{font-weight:bold;color:#7b68a8;margin:16px 0 6px 0;font-size:16px;opacity:0.4;}
@media(max-width:600px){
  .stat-row{grid-template-columns:1fr;}
  .form-row{grid-template-columns:1fr !important;}
}
.multi-group-wrap{
  border:1px solid #e2e8f0;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
}
.multi-item-row{
  display:grid;
  grid-template-columns:1.2fr 2fr 0.8fr 0.8fr;
  gap:8px;
  margin-bottom:8px;
  align-items:end;
}
.btn-add-row{
  opacity:0.7;
  background:#947fc7;
  color:#fff;
  margin-top:6px;
}
.btn-del-row{
  background:#e57373;
  color:white;
  padding:7px;
}
</style>
</head>
<body>
<div class="container">
  <h1>代購記帳</h1>
  <div class="stat-row">
    <div class="stat-card">本月總支出¥ <span id="sumCny">0.00</span></div>
    <div class="stat-card">本月總支出$ <span id="sumTwd">0</span></div>
  </div>
  <div class="search-bar">
    <label>關鍵字搜尋</label>
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="商品、人劇綜、訂購帳號、備註..." oninput="doSearch()">
      <button type="button" class="search-clear-x" onclick="clearSearch()">×</button>
    </div>
  </div>

  <!-- 單品項 -->
  <div class="single-collapse">
    <div class="single-collapse-header" id="header-single" onclick="toggleBlock('single')">
      <span>新增帳務｜單品項</span>
      <span id="arrow-single">▼</span>
    </div>
    <div class="single-collapse-content" id="panel-single">
      <div id="formSingle" class="form-wrap active">
        <input type="hidden" id="editIdSingle">
        <div class="form-row row-2col">
          <div class="auto-suggest">
            <label>訂購帳號</label>
            <input type="text" id="orderNoSingle" oninput="showSuggest('orderNo', this.value)">
            <div class="suggest-list" id="suggest-orderNo"></div>
          </div>
          <div>
            <label>訂購日期</label>
            <input type="date" id="orderDateSingle">
          </div>
        </div>
        <div class="form-row row-4col">
          <div class="auto-suggest">
            <label>人劇綜</label>
            <input type="text" id="artistSingle" oninput="showSuggest('artist', this.value)">
            <div class="suggest-list" id="suggest-artist"></div>
          </div>
          <div>
            <label>商品名稱</label>
            <input type="text" id="prodNameSingle">
          </div>
          <div>
            <label>款式</label>
            <input type="text" id="styleSingle">
          </div>
          <div>
            <label>數量</label>
            <input type="number" id="qtySingle" min="0" step="1">
          </div>
        </div>
        <div class="form-row row-3col">
          <div>
            <label>原金額¥</label>
            <input type="number" class="no-spin" id="oriCnySingle" step="0.01" inputmode="decimal">
          </div>
          <div>
            <label>實付金額¥</label>
            <input type="number" class="no-spin" id="payCnySingle" step="0.01" inputmode="decimal" oninput="calcSingle()">
          </div>
          <div>
            <label>實付金額$</label>
            <input type="number" class="no-spin" id="payTwdSingle" step="0.01" inputmode="decimal" oninput="calcSingle()">
          </div>
        </div>
        <div class="form-row row-3col">
          <div>
            <label>預計刷卡手續費$</label>
            <input type="number" id="feeTwdSingle" readonly>
          </div>
          <div>
            <label>匯率</label>
            <input type="number" id="rateSingle" readonly step="0.01">
          </div>
          <div>
            <label>實際利潤$</label>
            <input type="number" id="profitTwdSingle" readonly>
          </div>
        </div>
        <div class="sub-title">入賬資料</div>
        <div class="form-row row-4short">
          <div>
            <label>實收金額$</label>
            <input type="number" class="no-spin" id="recvTwdSingle" step="0.01" inputmode="decimal" oninput="calcSingle()">
          </div>
          <div>
            <label>收款來源</label>
            <select id="recvSourceSingle" onchange="otherSelect(this,'recvSource')"></select>
          </div>
          <div>
            <label>末五碼</label>
            <input type="text" id="last5Single">
          </div>
          <div>
            <label>收款日期</label>
            <input type="date" id="recvDateSingle">
          </div>
        </div>
        <div class="form-row row-2col">
          <div>
            <label>下單平台</label>
            <select id="platformSingle" onchange="otherSelect(this,'platform')"></select>
          </div>
          <div class="auto-suggest">
            <label>店面名稱</label>
            <input type="text" id="shopNameSingle" oninput="showSuggest('shopName', this.value)">
            <div class="suggest-list" id="suggest-shopName"></div>
          </div>
        </div>
        <div>
          <label>備註</label>
          <input type="text" id="remarkSingle">
        </div>
        <div class="photo-area">
          <label>照片</label>
          <div class="photo-preview" id="photoPreviewSingle">
            <label class="camera-upload-box"> 📷 <input type="file" id="photoInputSingle" accept="image/*" multiple onchange="uploadPhoto('single')"> </label>
          </div>
          <input type="hidden" id="photoArrSingle">
        </div>
        <div class="btn-group" style="margin-top:12px;">
          <button onclick="clearSingle()">清空</button>
          <button class="btn-full" onclick="saveSingle()">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 多品項 -->
  <div class="single-collapse">
    <div class="single-collapse-header" id="header-multi" onclick="toggleBlock('multi')">
      <span>新增帳務｜多品項</span>
      <span id="arrow-multi">▼</span>
    </div>
    <div class="single-collapse-content" id="panel-multi">
      <div id="formMulti" class="form-wrap active">
        <input type="hidden" id="editIdMulti">
        <div class="form-row row-2col">
          <div class="auto-suggest">
            <label>訂購帳號</label>
            <input type="text" id="orderNoMulti" oninput="showSuggest('orderNo', this.value)">
          </div>
          <div>
            <label>訂購日期</label>
            <input type="date" id="orderDateMulti">
          </div>
        </div>
        <div id="multiProductBlock" class="multi-group-wrap">
          <label>商品清單</label>
          <div id="multiRowsWrap"></div>
          <button type="button" class="btn-add-row" onclick="addMultiRow()">+ 新增一組商品</button>
        </div>
        <div class="form-row row-3col">
          <div>
            <label>原金額¥</label>
            <input type="number" class="no-spin" id="oriCnyMulti" step="0.01" inputmode="decimal">
          </div>
          <div>
            <label>實付金額¥</label>
            <input type="number" class="no-spin" id="payCnyMulti" step="0.01" inputmode="decimal" oninput="calcMulti()">
          </div>
          <div>
            <label>實付金額$</label>
            <input type="number" class="no-spin" id="payTwdMulti" step="0.01" inputmode="decimal" oninput="calcMulti()">
          </div>
        </div>
        <div class="form-row row-3col">
          <div>
            <label>預計刷卡手續費$</label>
            <input type="number" id="feeTwdMulti" readonly>
          </div>
          <div>
            <label>匯率</label>
            <input type="number" id="rateMulti" readonly step="0.01">
          </div>
          <div>
            <label>實際利潤$</label>
            <input type="number" id="profitTwdMulti" readonly>
          </div>
        </div>
        <div class="sub-title">入賬資料</div>
        <div class="form-row row-4short">
          <div>
            <label>實收金額$</label>
            <input type="number" class="no-spin" id="recvTwdMulti" step="0.01" inputmode="decimal" oninput="calcMulti()">
          </div>
          <div>
            <label>收款來源</label>
            <select id="recvSourceMulti" onchange="otherSelect(this,'recvSource')"></select>
          </div>
          <div>
            <label>末五碼</label>
            <input type="text" id="last5Multi">
          </div>
          <div>
            <label>收款日期</label>
            <input type="date" id="recvDateMulti">
          </div>
        </div>
        <div class="form-row row-2col">
          <div>
            <label>下單平台</label>
            <select id="platformMulti" onchange="otherSelect(this,'platform')"></select>
          </div>
          <div class="auto-suggest">
            <label>店面名稱</label>
            <input type="text" id="shopNameMulti" oninput="showSuggest('shopName', this.value)">
            <div class="suggest-list" id="suggest-shopName"></div>
          </div>
        </div>
        <div>
          <label>備註</label>
          <input type="text" id="remarkMulti">
        </div>
        <div class="photo-area">
          <label>照片</label>
          <div class="photo-preview" id="photoPreviewMulti">
            <label class="camera-upload-box"> 📷 <input type="file" id="photoInputMulti" accept="image/*" multiple onchange="uploadPhoto('multi')"> </label>
          </div>
          <input type="hidden" id="photoArrMulti">
        </div>
        <div class="btn-group" style="margin-top:12px;">
          <button onclick="clearMulti()">清空</button>
          <button class="btn-full" onclick="saveMulti()">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- 儲值換匯 -->
  <div class="single-collapse">
    <div class="single-collapse-header" id="header-exch" onclick="toggleBlock('exch')">
      <span>新增帳務｜儲值/換匯</span>
      <span id="arrow-exch">▼</span>
    </div>
    <div class="single-collapse-content" id="panel-exch">
      <div id="formExch" class="form-wrap active">
        <input type="hidden" id="editIdExch">
        <div class="form-row row-3col">
          <div>
            <label>交易日期</label>
            <input type="date" id="exchDate">
          </div>
          <div>
            <label>支付金額¥</label>
            <input type="number" id="exchCny" step="0.01" inputmode="decimal" oninput="calcExch()">
          </div>
          <div>
            <label>支付金額$</label>
            <input type="number" id="exchTwd" step="0.01" inputmode="decimal" oninput="calcExch()">
          </div>
        </div>
        <div class="form-row row-3col">
          <div>
            <label>刷卡手續$</label>
            <input type="number" id="exchFee" readonly>
          </div>
          <div>
            <label>匯率</label>
            <input type="number" id="exchRate" readonly step="0.0001">
          </div>
          <div>
            <label>對方</label>
            <select id="exchTarget" onchange="otherSelect(this,'exchTarget')"></select>
          </div>
        </div>
        <div class="form-row row-2col">
          <div>
            <label>用途</label>
            <select id="exchPurpose" onchange="otherSelect(this,'exchPurpose')"></select>
          </div>
          <div></div>
        </div>
        <div class="btn-group" style="margin-top:12px;">
          <button onclick="clearExch()">清空</button>
          <button class="btn-full" onclick="saveExch()">儲存</button>
        </div>
      </div>
    </div>
  </div>

  <div id="listWrap"></div>

  <div class="filter-bar">
    <button onclick="toggleFilter()">查詢彙整資料</button>
    <div class="filter-content" id="filterContent">
      <label>彙整區間</label>
      <input type="date" id="startDate">
      <input type="date" id="endDate">
      <button onclick="renderAll()">全部資料</button>
      <button onclick="renderRange()">區間彙整</button>
    </div>
  </div>
</div>

<script>
// 抓台灣本地時區今日日期
function getLocalToday(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

let blockState = { single: false, multi: false, exch: false };
function toggleBlock(key){
  blockState[key] = !blockState[key];
  const panel = document.getElementById("panel-"+key);
  const arrow = document.getElementById("arrow-"+key);
  if(blockState[key]){ panel.classList.add("open"); arrow.textContent = "▲"; }
  else{ panel.classList.remove("open"); arrow.textContent = "▼"; }
}
let filterOpen = false;
function toggleFilter(){
  filterOpen = !filterOpen;
  const c = document.getElementById("filterContent");
  if(filterOpen) c.classList.add("open");
  else c.classList.remove("open");
}

const STORAGE_KEY = "代购BookData";
const BASE_RECV_SOURCE = ["中信$","郵局$","中信無卡$","台新$","台新無卡$","國泰$","台灣配$","LINE BANK","i pass money","line pay money"];
const BASE_PLATFORM = ["淘寶","淘寶（騰訊）","淘寶（優酷）","淘寶（愛奇藝）","騰訊","優酷","愛奇藝","小芒","微店","微信（拼團呀）","微信（拼谷）","閑魚","小紅書","抖音","京東","QQ音樂","酷狗音樂","網易雲","拼多多","阿里巴巴","微博","紛玩島","大麥","百度網盤"];
const BASE_EXCH_TARGET = ["解語花","友宜集運"];
const BASE_EXCH_PURPOSE = ["換匯","儲值集運"];

let data = {
  products:[],
  history:{
    orderNo:[],
    artist:[],
    shopName:[],
    recvSource:[...BASE_RECV_SOURCE],
    platform:[...BASE_PLATFORM],
    exchTarget:[...BASE_EXCH_TARGET],
    exchPurpose:[...BASE_EXCH_PURPOSE]
  }
};
let searchKeyword = "";
let multiRows = [];
let photoCache = { single:[], multi:[] };
let currentEditIndex = -1;

function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const old = JSON.parse(raw);
      if(Array.isArray(old) && old.length>0 && !old.products){
        data.products = old.map(item=>{
          return {
            type:"migrated",
            orderDate:item.date||"",
            orderNo:item.orderNo||"",
            artist:item.artist||"",
            prodName:item.name||"",
            style:item.style||"",
            qty:item.qty||1,
            multiItems: null,
            oriCny:item.oriCny||0,
            payCny:item.cny||0,
            payTwd:item.twd||0,
            recvTwd:item.recvTwd||0,
            last5:item.last5||"",
            feeTwd:Math.round((item.twd||0)*0.015),
            profitTwd: (item.recvTwd||0) - ((item.twd||0)+Math.round((item.twd||0)*0.015)),
            rate: item.payCny>0 ? Number((item.twd/item.cny).toFixed(2)) : 0,
            recvSource:item.recvSource||"",
            recvDate:item.recvDate||"",
            platform:item.platform||"",
            shopName:item.shopName||"",
            photos:item.photos||[],
            remark:item.remark||""
          }
        })
      }else if(old.products){
        data = old;
      }
    }catch(e){console.error(e);}
  }

  if(!data.history.platform || data.history.platform.length === 0){
    data.history.platform = [...BASE_PLATFORM];
  }

  fillSelect("recvSourceSingle");
  fillSelect("recvSourceMulti");
  fillSelect("platformSingle");
  fillSelect("platformMulti");
  fillSelect("exchTarget");
  fillSelect("exchPurpose");
  renderAll();
}
function saveStorage(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function fillSelect(id){
  const sel = document.getElementById(id);
  if(!sel) return;
  let key;
  if(id.includes("recvSource")) key="recvSource";
  else if(id.includes("platform")) key="platform";
  else if(id==="exchTarget") key="exchTarget";
  else if(id==="exchPurpose") key="exchPurpose";
  else return;

  sel.innerHTML = "";

  const list = Array.isArray(data.history[key]) ? data.history[key] : [];
  list.forEach(v=>{
    if(v && String(v).trim() !== ""){
      const opt = document.createElement("option");
      opt.value = v;
      opt.innerText = v;
      sel.appendChild(opt);
    }
  });

  const optOther = document.createElement("option");
  optOther.value = "_OTHER_";
  optOther.innerText = "其他";
  sel.appendChild(optOther);
}

function otherSelect(el, key){
  if(el.value === "_OTHER_"){
    const val = prompt("輸入新選項：");
    if(val && val.trim()){
      const v = val.trim();
      if(!data.history[key]) data.history[key] = [];
      if(!data.history[key].includes(v)) data.history[key].push(v);
      fillSelect(el.id);
      el.value = v;
      saveStorage();
    }else{
      el.selectedIndex = 0;
    }
  }
}

function showSuggest(key, val){
  const wrap = document.getElementById("suggest-"+key);
  wrap.innerHTML="";
  if(!val.trim()){wrap.style.display="none";return;}
  const list = data.history[key]||[];
  const match = list.filter(x=>x.toLowerCase().includes(val.toLowerCase()));
  if(match.length===0){wrap.style.display="none";return;}
  match.forEach(t=>{
    const div = document.createElement("div");div.className="suggest-item";div.innerText=t;
    div.onclick=()=>{document.getElementById(key).value=t;wrap.style.display="none";};
    wrap.appendChild(div);
  })
  wrap.style.display="block";
}
function pushHistory(key, val){
  if(!val||!val.trim()) return;
  const v = val.trim();
  if(!data.history[key]) data.history[key]=[];
  if(!data.history[key].includes(v)) data.history[key].push(v);
}

function calcSingle(){
  const payTwd = Number(document.getElementById("payTwdSingle").value||0);
  const payCny = Number(document.getElementById("payCnySingle").value||0);
  const recvTwd = Number(document.getElementById("recvTwdSingle").value||0);
  const fee = Math.round(payTwd * 0.015);
  const rate = payCny > 0 ? Number((payTwd / payCny).toFixed(2)) : 0;
  const profit = recvTwd - (payTwd + fee);
  document.getElementById("feeTwdSingle").value = fee;
  document.getElementById("rateSingle").value = rate;
  document.getElementById("profitTwdSingle").value = profit;
}

function calcExch(){
  const exchTwd = Number(document.getElementById("exchTwd").value||0);
  const exchCny = Number(document.getElementById("exchCny").value||0);
  const fee = Math.round(exchTwd * 0.015);
  const rate = exchCny>0 ? (exchTwd / exchCny).toFixed(4) : "";
  document.getElementById("exchFee").value = fee;
  document.getElementById("exchRate").value = rate;
}

function renderMultiRows(){
  const wrap = document.getElementById("multiRowsWrap");
  wrap.innerHTML = "";
  multiRows.forEach((rowData, idx)=>{
    const div = document.createElement("div");
    div.className = "multi-item-row";
    div.innerHTML = `
      <input type="text" placeholder="人劇綜" value="${rowData.artist||''}" onchange="updateMultiRow(${idx},'artist',this.value)">
      <input type="text" placeholder="商品名稱" value="${rowData.name||''}" onchange="updateMultiRow(${idx},'name',this.value)">
      <input type="text" placeholder="款式" value="${rowData.style||''}" onchange="updateMultiRow(${idx},'style',this.value)">
      <input type="number" min="0" step="1" placeholder="數量" value="${rowData.qty||''}" onchange="updateMultiRow(${idx},'qty',Number(this.value))">
      <button class="btn-del-row" onclick="delMultiRow(${idx})">刪</button>
    `;
    wrap.appendChild(div);
  })
}
function addMultiRow(){ multiRows.push({artist:"", name:"", style:"", qty:""}); renderMultiRows(); }
function updateMultiRow(idx, key, val){ multiRows[idx][key] = val; }
function delMultiRow(idx){ multiRows.splice(idx,1); renderMultiRows(); }

function uploadPhoto(type){
  const inputEl = document.getElementById("photoInput"+type.charAt(0).toUpperCase()+type.slice(1));
  const previewWrap = document.getElementById("photoPreview"+type.charAt(0).toUpperCase()+type.slice(1));
  const files = inputEl.files;
  for(let f of files){
    const r = new FileReader();
    r.onload = e=>{ photoCache[type].push(e.target.result); renderPhotoPreview(type); }
    r.readAsDataURL(f);
  }
}
function renderPhotoPreview(type){
  const previewWrap = document.getElementById("photoPreview"+type.charAt(0).toUpperCase()+type.slice(1));
  previewWrap.innerHTML = `
    <label class="camera-upload-box"> 📷 <input type="file" id="photoInput${type.charAt(0).toUpperCase()+type.slice(1)}" accept="image/*" multiple onchange="uploadPhoto('${type}')"> </label>
  `;
  photoCache[type].forEach((src,i)=>{
    const img = document.createElement("img");img.src=src;
    img.onclick=()=>{ photoCache[type].splice(i,1); renderPhotoPreview(type); }
    previewWrap.appendChild(img);
  })
}

function editItem(idx){
  currentEditIndex = idx;
  const item = data.products[idx];
  if(item.type === "normal" || item.type === "migrated"){
    toggleBlock('single');
    document.getElementById("editIdSingle").value = idx;
    document.getElementById("orderDateSingle").value = item.orderDate || "";
    document.getElementById("orderNoSingle").value = item.orderNo || "";
    document.getElementById("artistSingle").value = item.artist || "";
    document.getElementById("prodNameSingle").value = item.prodName || "";
    document.getElementById("styleSingle").value = item.style || "";
    document.getElementById("qtySingle").value = item.qty || "";
    document.getElementById("oriCnySingle").value = item.oriCny || "";
    document.getElementById("payCnySingle").value = item.payCny || "";
    document.getElementById("payTwdSingle").value = item.payTwd || "";
    document.getElementById("recvTwdSingle").value = item.recvTwd || "";
    document.getElementById("last5Single").value = item.last5 || "";
    document.getElementById("recvSourceSingle").value = item.recvSource || "";
    document.getElementById("recvDateSingle").value = item.recvDate || "";
    document.getElementById("platformSingle").value = item.platform || "";
    document.getElementById("shopNameSingle").value = item.shopName || "";
    document.getElementById("remarkSingle").value = item.remark || "";
    photoCache.single = Array.isArray(item.photos) ? [...item.photos] : [];
    renderPhotoPreview("single");
    calcSingle();
  }else if(item.type === "multi"){
    toggleBlock('multi');
    document.getElementById("editIdMulti").value = idx;
    document.getElementById("orderDateMulti").value = item.orderDate || "";
    document.getElementById("orderNoMulti").value = item.orderNo || "";
    multiRows = Array.isArray(item.multiItems) ? JSON.parse(JSON.stringify(item.multiItems)) : [{artist:"",name:"",style:"",qty:""}];
    renderMultiRows();
    document.getElementById("oriCnyMulti").value = item.oriCny || "";
    document.getElementById("payCnyMulti").value = item.payCny || "";
    document.getElementById("payTwdMulti").value = item.payTwd || "";
    document.getElementById("recvTwdMulti").value = item.recvTwd || "";
    document.getElementById("last5Multi").value = item.last5 || "";
    document.getElementById("recvSourceMulti").value = item.recvSource || "";
    document.getElementById("recvDateMulti").value = item.recvDate || "";
    document.getElementById("platformMulti").value = item.platform || "";
    document.getElementById("shopNameMulti").value = item.shopName || "";
    document.getElementById("remarkMulti").value = item.remark || "";
    photoCache.multi = Array.isArray(item.photos) ? [...item.photos] : [];
    renderPhotoPreview("multi");
    calcMulti();
  }else if(item.type === "exch"){
    toggleBlock('exch');
    document.getElementById("editIdExch").value = idx;
    document.getElementById("exchDate").value = item.exchDate || "";
    document.getElementById("exchCny").value = item.exchCny || "";
    document.getElementById("exchTwd").value = item.exchTwd || "";
    document.getElementById("exchTarget").value = item.exchTarget || "";
    document.getElementById("exchPurpose").value = item.exchPurpose || "";
    calcExch();
  }
  window.scrollTo({top:0,behavior:"smooth"});
}
function delItem(idx){
  if(!confirm("確認刪除這筆帳務？")) return;
  data.products.splice(idx,1);
  saveStorage(); renderAll();
}

function doSearch(){ searchKeyword = document.getElementById("searchInput").value.trim().toLowerCase(); renderAll(); }
function clearSearch(){ document.getElementById("searchInput").value = ""; searchKeyword = ""; renderAll(); }
function filterByKeyword(list){
  if(!searchKeyword) return list;
  return list.filter(it=>{
    let textPool = "";
    textPool += (it.orderDate||"") + (it.orderNo||"") + (it.artist||"") + (it.prodName||"") + (it.style||"") + (it.remark||"") + (it.shopName||"") + (it.platform||"") + (it.last5||"");
    if(Array.isArray(it.multiItems)){ it.multiItems.forEach(p=>{ textPool += (p.artist||"") + (p.name||"") + (p.style||""); }) }
    if(it.type==="exch") textPool += (it.exchDate||"") + (it.exchTarget||"") + (it.exchPurpose||"");
    return textPool.toLowerCase().includes(searchKeyword);
  })
}
function calcSum(list){
  let sumCny = 0, sumTwd = 0;
  list.forEach(it=>{
    if(it.type!=="exch"){
      sumCny += Number(it.payCny||0);
      sumTwd += (Number(it.payTwd||0)+Number(it.feeTwd||0));
    }
  })
  document.getElementById("sumCny").innerText = sumCny.toFixed(2);
  document.getElementById("sumTwd").innerText = Math.round(sumTwd);
}

function renderAll(){ let list = filterByKeyword([...data.products]); calcSum(list); renderItems(list); }
function renderRange(){
  const s = document.getElementById("startDate").value;
  const e = document.getElementById("endDate").value;
  if(!s || !e) return alert("請選起訖日期");
  let filtered = data.products.filter(x=>{
    const d = x.type==="exch" ? x.exchDate : x.orderDate;
    return d >= s && d <= e;
  })
  filtered = filterByKeyword(filtered); calcSum(filtered); renderItems(filtered);
}

  document.getElementById("orderDateSingle").value = today;
  document.getElementById("recvDateSingle").value = today;
  document.getElementById("orderDateMulti").value = today;
  document.getElementById("recvDateMulti").value = today;
