<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>代購記帳</title>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/pinia@2/dist/pinia.iife.prod.js"></script>
<script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
<style>
:root{
  --main-purple: #e9e4f5;
  --card-single: #d8cfee;
  --card-multi: #dcebf8;
  --card-exchange: #dcf2e8;
  --text-primary: #2c2c2c;
  --text-secondary: #666;
  --border-color: #d1c8e6;
  --btn-primary: #b8a9dd;
  --btn-hover: #a492d0;
  --danger: #e57373;
  --success: #81c784;
  --white: #ffffff;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
body{background:var(--main-purple);color:var(--text-primary);padding:12px;}
.container{max-width:1000px;margin:0 auto;}
.nav-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.nav-btn{padding:10px 16px;border:none;border-radius:10px;background:var(--btn-primary);color:#fff;font-weight:500;cursor:pointer;transition:0.2s;}
.nav-btn:hover{background:var(--btn-hover);}
.nav-btn.active{box-shadow:0 0 0 2px #fff;}
.card{background:var(--white);border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--border-color);}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.stat-item{padding:16px;border-radius:10px;text-align:center;font-weight:500;}
.stat-item:nth-child(1){background:#d8cfee;}
.stat-item:nth-child(2){background:#dcebf8;}
.form-title{font-weight:600;margin:12px 0 6px;font-size:1.05rem;}
.sub-title{font-weight:600;margin:18px 0 8px;font-size:1.1rem;}
.row{display:grid;gap:10px;margin-bottom:10px;align-items:center;}
.row-2{grid-template-columns:1fr 1fr;}
.row-3{grid-template-columns:0.8fr 1.4fr 0.6fr;}
.row-4{grid-template-columns:0.7fr 1fr 0.6fr 0.5fr;}
input, select{padding:10px;border:1px solid var(--border-color);border-radius:8px;font-size:1rem;background:#fff;}
input[type="number"]{-moz-appearance:textfield;}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{display:none;}
.autocomplete-wrap{position:relative;}
.suggest-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--border-color);border-radius:8px;z-index:99;max-height:160px;overflow-y:auto;}
.suggest-item{padding:8px 10px;cursor:pointer;}
.suggest-item:hover{background:var(--main-purple);}
.btn{padding:10px 14px;border:none;border-radius:8px;cursor:pointer;font-weight:500;transition:0.2s;}
.btn-add{background:var(--btn-primary);color:#fff;margin-bottom:14px;}
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:flex;align-items:center;justify-content:center;z-index:100;}
.modal{width:94%;max-width:720px;max-height:90vh;overflow-y:auto;background:#fff;border-radius:14px;padding:16px;}
.collapse-header{padding:12px;border-radius:10px;margin-bottom:8px;cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center;}
.collapse-single{background:var(--card-single);}
.collapse-multi{background:var(--card-multi);}
.collapse-exchange{background:var(--card-exchange);}
.upload-box{width:64px;height:64px;border:2px dashed var(--border-color);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--text-secondary);cursor:pointer;position:relative;}
.upload-box input{position:absolute;inset:0;opacity:0;cursor:pointer;}
.img-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.img-preview img{width:64px;height:64px;object-fit:cover;border-radius:6px;}
.record-item{padding:12px;border-radius:10px;background:#fff;margin-bottom:10px;border:1px solid var(--border-color);cursor:pointer;}
.record-item:hover{background:#f8f6fc;}
.finance-filter{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;align-items:center;}
@media(max-width:640px){
  .row-3,.row-4,.stat-row{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="app" class="container"></div>
<script>
const { createApp, ref, reactive, computed, watch, onMounted, nextTick } = Vue;
const { createPinia, defineStore } = Pinia;
const { createRouter, createWebHashHistory } = VueRouter;

// ========== 資料遷移轉換函數（舊格式自動轉新products結構） ==========
function convertOldRecord(old){
  if(!old) return null;
  const newRec = {
    id: old.id || crypto.randomUUID(),
    recordType: "single",
    orderAccount: old.orderAccount || "",
    orderDate: old.date || "",
    dramaTag: old.tag || "",
    productName: old.name || "",
    style: old.style || "",
    qty: Number(old.qty || 1),
    originalCNY: Number(old.originalCNY || 0),
    realPayCNY: Number(old.realCNY || 0),
    realPayTWD: Number(old.realTWD || 0),
    payMethod: old.payMethod || "",
    cardFeeTWD: Number(old.cardFeeTWD || 0),
    rate: Number(old.rate || 0),
    profitTWD: Number(old.profitTWD || 0),
    receiveTWD: Number(old.receiveTWD || 0),
    receiveSource: old.receiveSource || "",
    last5Code: old.last5Code || "",
    receiveDate: old.receiveDate || "",
    platform: old.platform || "",
    shopName: old.shopName || "",
    imgs: Array.isArray(old.imgs) ? old.imgs : [],
    remark: old.remark || "",
    tradeDate: "",
    payCNY: 0,
    payTWD: 0,
    exchangeFeeTWD:0,
    targetUser:"",
    purpose:""
  }
  return newRec;
}

// ========== Pinia Store ==========
const useRecordStore = defineStore('record',{
  state:()=>({
    rawList:[],
    suggestion:{
      orderAccount:[],
      dramaTag:[],
      shopName:[]
    },
    selectOpts:{
      payMethod:["支付寶¥-中信","支付寶¥-國泰","支付寶-¥餘額","微信¥-中信","微信¥-國泰","微信-¥餘額","中信$","郵局$","台新$","國泰$","台灣配$"],
      receiveSource:["中信$","郵局$","中信無卡$","台新$","台新無卡$","國泰$","台灣配$","LINE BANK","i pass money","line pay money"],
      platform:["淘寶","淘寶（騰訊）","淘寶（優酷）","淘寶（愛奇藝）","騰訊","優酷","愛奇藝","小芒","微店","微信（拼團呀）","微信（拼谷）","閑魚","小紅書","抖音","京東","QQ音樂","酷狗音樂","網易雲","拼多多","阿里巴巴","微博","紛玩島","大麥","百度網盤"],
      targetUser:["解語花","友宜集運"],
      purpose:["換匯","儲值集運"]
    }
  }),
  getters:{
    recordList(state){
      return state.rawList.map(item=>{
        if(!item.recordType) return convertOldRecord(item);
        return item;
      }).filter(Boolean)
    },
    monthCNY(state){
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth();
      return this.recordList.filter(r=>{
        const d = new Date(r.orderDate || r.tradeDate);
        return d.getFullYear()===y && d.getMonth()===m
      }).reduce((s,i)=>s + Number(i.realPayCNY||0),0)
    },
    monthTWD(state){
      const now = new Date();
      const y = now.getFullYear();
      const m = now.getMonth();
      return this.recordList.filter(r=>{
        const d = new Date(r.orderDate || r.tradeDate);
        return d.getFullYear()===y && d.getMonth()===m
      }).reduce((s,i)=>s + (Number(i.realPayTWD||0)+Number(i.cardFeeTWD||0)),0)
    }
  },
  actions:{
    load(){
      const raw = localStorage.getItem("代购RecordRaw");
      if(raw) this.rawList = JSON.parse(raw);
      const sug = localStorage.getItem("suggestion");
      if(sug) this.suggestion = JSON.parse(sug);

      // ✅ 重點修復：舊selectOpts和預設合併，缺少的key補上預設陣列
      const defaultOpts = {
        payMethod:["支付寶¥-中信","支付寶¥-國泰","支付寶-¥餘額","微信¥-中信","微信¥-國泰","微信-¥餘額","中信$","郵局$","台新$","國泰$","台灣配$"],
        receiveSource:["中信$","郵局$","中信無卡$","台新$","台新無卡$","國泰$","台灣配$","LINE BANK","i pass money","line pay money"],
        platform:["淘寶","淘寶（騰訊）","淘寶（優酷）","淘寶（愛奇藝）","騰訊","優酷","愛奇藝","小芒","微店","微信（拼團呀）","微信（拼谷）","閑魚","小紅書","抖音","京東","QQ音樂","酷狗音樂","網易雲","拼多多","阿里巴巴","微博","紛玩島","大麥","百度網盤"],
        targetUser:["解語花","友宜集運"],
        purpose:["換匯","儲值集運"]
      }
      const optsStr = localStorage.getItem("selectOpts");
      if(optsStr){
        const savedOpts = JSON.parse(optsStr);
        // 只補不存在的key，已經有的保留（你新增的選項不會丟掉）
        for(const k in defaultOpts){
          if(!savedOpts[k]){
            savedOpts[k] = [...defaultOpts[k]]
          }
        }
        this.selectOpts = savedOpts;
      }else{
        this.selectOpts = {...defaultOpts}
      }
    },
    saveRaw(){
      localStorage.setItem("代购RecordRaw",JSON.stringify(this.rawList));
    },
    saveSuggest(){
      localStorage.setItem("suggestion",JSON.stringify(this.suggestion));
    },
    saveOpts(){
      localStorage.setItem("selectOpts",JSON.stringify(this.selectOpts));
    },
    addSuggest(key,val){
      if(!val) return;
      if(!this.suggestion[key].includes(val)){
        this.suggestion[key].push(val);
        this.saveSuggest();
      }
    },
    addOpt(key,val){
      if(!val) return;
      if(!this.selectOpts[key].includes(val)){
        this.selectOpts[key].push(val);
        this.saveOpts();
      }
    },
    addRecord(rec){
      this.rawList.push(rec);
      this.saveRaw();
      this.addSuggest("orderAccount",rec.orderAccount);
      this.addSuggest("dramaTag",rec.dramaTag);
      this.addSuggest("shopName",rec.shopName);
      if(rec.payMethod) this.addOpt("payMethod",rec.payMethod);
      if(rec.receiveSource) this.addOpt("receiveSource",rec.receiveSource);
      if(rec.platform) this.addOpt("platform",rec.platform);
      if(rec.targetUser) this.addOpt("targetUser",rec.targetUser);
      if(rec.purpose) this.addOpt("purpose",rec.purpose);
    },
    updateRecord(id,newRec){
      const idx = this.rawList.findIndex(i=>i.id===id);
      if(idx>-1){
        this.rawList[idx] = newRec;
        this.saveRaw();
        this.addSuggest("orderAccount",newRec.orderAccount);
        this.addSuggest("dramaTag",newRec.dramaTag);
        this.addSuggest("shopName",newRec.shopName);
        if(newRec.payMethod) this.addOpt("payMethod",newRec.payMethod);
        if(newRec.receiveSource) this.addOpt("receiveSource",newRec.receiveSource);
        if(newRec.platform) this.addOpt("platform",newRec.platform);
        if(newRec.targetUser) this.addOpt("targetUser",newRec.targetUser);
        if(newRec.purpose) this.addOpt("purpose",newRec.purpose);
      }
    },
    delRecord(id){
      const idx = this.rawList.findIndex(i=>i.id===id);
      if(idx>-1){
        this.rawList.splice(idx,1);
        this.saveRaw();
      }
    }
  }
})

// ========== 路由 ==========
const routes = [
  {path:'/expense',component:{
    template:`
      <div>
        <div class="nav-bar">
          <button class="nav-btn active">代購記帳</button>
          <button class="nav-btn" @click="$router.push('/finance')">財務表</button>
        </div>
        <div class="stat-row">
          <div class="stat-item">本月總支出 ¥：{{ store.monthCNY.toFixed(2) }}</div>
          <div class="stat-item">本月總支出 $：{{ store.monthTWD.toFixed(2) }}</div>
        </div>
        <button class="btn btn-add" @click="openModal()">新增帳務</button>
        <div v-for="r in store.recordList" :key="r.id" class="record-item" @click="editRec(r)">
          <div>{{r.orderAccount || r.tradeDate}}｜{{r.recordType==='single'?'單品項':r.recordType==='multi'?'多品項':'儲值/換匯'}}｜{{r.productName||r.purpose||''}}</div>
          <div style="font-size:0.9rem;color:#666">¥{{r.realPayCNY}} | ${{r.realPayTWD}} 手續${{r.cardFeeTWD}}</div>
        </div>
        <div v-if="modalShow" class="modal-mask" @click.self="modalShow=false">
          <div class="modal">
            <div class="collapse-header collapse-single" @click="tabSingle=!tabSingle">帳務｜單品項 <span>{{tabSingle?'−':'+'}}</span></div>
            <div v-if="tabSingle">
              <div class="row row-2">
                <div class="autocomplete-wrap">
                  <label>訂購帳號</label>
                  <input v-model="formSingle.orderAccount" @input="filterSug('orderAccount','single')" @blur="hideSug" />
                  <div class="suggest-list" v-if="sugShow.orderAccount && sugList.orderAccount.length">
                    <div class="suggest-item" v-for="s in sugList.orderAccount" @click="pickSug('orderAccount','single',s)">{{s}}</div>
                  </div>
                </div>
                <div>
                  <label>訂購日期</label>
                  <input v-model="formSingle.orderDate" type="date"/>
                </div>
              </div>
              <div class="row row-3">
                <div class="autocomplete-wrap">
                  <label>人劇綜</label>
                  <input v-model="formSingle.dramaTag" @input="filterSug('dramaTag','single')" @blur="hideSug"/>
                  <div class="suggest-list" v-if="sugShow.dramaTag && sugList.dramaTag.length">
                    <div class="suggest-item" v-for="s in sugList.dramaTag" @click="pickSug('dramaTag','single',s)">{{s}}</div>
                  </div>
                </div>
                <div><label>商品名稱</label><input v-model="formSingle.productName"/></div>
                <div><label>款式</label><input v-model="formSingle.style"/></div>
                <div><label>數量</label><input v-model.number="formSingle.qty" type="number" inputmode="decimal"/></div>
              </div>
              <div class="sub-title">費用輸入</div>
              <div class="row row-4">
                <div><label>原金額 ¥</label><input v-model.number="formSingle.originalCNY" type="number" inputmode="decimal"/></div>
                <div><label>實付金額 ¥</label><input v-model.number="formSingle.realPayCNY" type="number" inputmode="decimal" @input="calcSingle"/></div>
                <div><label>實付金額 $</label><input v-model.number="formSingle.realPayTWD" type="number" inputmode="decimal" @input="calcSingle"/></div>
              </div>
              <div class="row row-4">
                <div>
                  <label>付款方式</label>
                  <select v-model="formSingle.payMethod" @change="handleSel('payMethod','single')">
                    <option v-for="o in store.selectOpts.payMethod" :key="o">{{o}}</option>
                    <option value="__other__">其他</option>
                  </select>
                  <input v-if="formSingle.payMethod==='__other__'" v-model="formSingle.payMethodOther" placeholder="輸入新付款方式"/>
                </div>
                <div><label>預計刷卡手續費 $</label><input v-model.number="formSingle.cardFeeTWD" readonly/></div>
                <div><label>匯率</label><input v-model.number="formSingle.rate" readonly/></div>
                <div><label>實際利潤 $</label><input v-model.number="formSingle.profitTWD" readonly/></div>
              </div>
              <div class="sub-title">客戶入帳資料</div>
              <div class="row row-4">
                <div><label>實收金額 $</label><input v-model.number="formSingle.receiveTWD" type="number" inputmode="decimal" @input="calcSingle"/></div>
                <div>
                  <label>收款來源</label>
                  <select v-model="formSingle.receiveSource" @change="handleSel('receiveSource','single')">
                    <option v-for="o in store.selectOpts.receiveSource" :key="o">{{o}}</option>
                    <option value="__other__">其他</option>
                  </select>
                  <input v-if="formSingle.receiveSource==='__other__'" v-model="formSingle.receiveSourceOther" placeholder="輸入新收款來源"/>
                </div>
                <div><label>末五碼</label><input v-model="formSingle.last5Code"/></div>
                <div><label>收款日期</label><input v-model="formSingle.receiveDate" type="date"/></div>
              </div>
              <div class="row row-2">
                <div>
                  <label>下單平台</label>
                  <select v-model="formSingle.platform" @change="handleSel('platform','single')">
                    <option v-for="o in store.selectOpts.platform" :key="o">{{o}}</option>
                    <option value="__other__">其他</option>
                  </select>
                  <input v-if="formSingle.platform==='__other__'" v-model="formSingle.platformOther" placeholder="輸入新平台"/>
                </div>
                <div class="autocomplete-wrap">
                  <label>店面名稱</label>
                  <input v-model="formSingle.shopName" @input="filterSug('shopName','single')" @blur="hideSug"/>
                  <div class="suggest-list" v-if="sugShow.shopName && sugList.shopName.length">
                    <div class="suggest-item" v-for="s in sugList.shopName" @click="pickSug('shopName','single',s)">{{s}}</div>
                  </div>
                </div>
              </div>
              <div class="form-title">照片</div>
              <div class="upload-box">📷
                <input type="file" multiple accept="image/*" @change="uploadImg($event,'single')"/>
              </div>
              <div class="img-preview">
                <img v-for="(i,idx) in formSingle.imgs" :key="idx" :src="i" @click="previewImg(i)" style="cursor:pointer"/>
              </div>
              <div class="form-title">備註</div>
              <input v-model="formSingle.remark"/>
              <div style="margin-top:14px;display:flex;gap:8px;">
                <button class="btn btn-add" @click="saveSingle">儲存</button>
                <button class="btn" style="background:#ccc" @click="modalShow=false">取消</button>
              </div>
            </div>
            <div class="collapse-header collapse-multi" @click="tabMulti=!tabMulti">帳務｜多品項 <span>{{tabMulti?'−':'+'}}</span></div>
            <div v-if="tabMulti">
              <div class="row row-2">
                <div class="autocomplete-wrap">
                  <label>訂購帳號</label>
                  <input v-model="formMulti.orderAccount" @input="filterSug('orderAccount','multi')" @blur="hideSug"/>
                  <div class="suggest-list" v-if="sugShow.orderAccount && sugList.orderAccount.length">
                    <div class="suggest-item" v-for="s in sugList.orderAccount" @click="pickSug('orderAccount','multi',s)">{{s}}</div>
                  </div>
                </div>
                <div><label>訂購日期</label><input v-model="formMulti.orderDate" type="date"/></div>
              </div>
              <div class="row row-3">
                <div class="autocomplete-wrap">
                  <label>人劇綜</label>
                  <input v-model="formMulti.dramaTag" @input="filterSug('dramaTag','multi')" @blur="hideSug"/>
                  <div class="suggest-list" v-if="sugShow.dramaTag && sugList.dramaTag.length">
                    <div class="suggest-item" v-for="s in sugList.dramaTag" @click="pickSug('dramaTag','multi',s)">{{s}}</div>
                  </div>
                </div>
                <div><label>商品名稱</label><input v-model="formMulti.productName"/></div>
                <div><label>款式</label><input v-model="formMulti.style"/></div>
                <div><label>數量</label><input v-model.number="formMulti.qty" type="number" inputmode="decimal"/></div>
              </div>
              <div class="sub-title">費用輸入</div>
              <div class="row row-4">
                <div><label>原金額 ¥</label><input v-model.number="formMulti.originalCNY" type="number" inputmode="decimal"/></div>
                <div><label>實付金額 ¥</label><input v-model.number="formMulti.realPayCNY" type="number" inputmode="decimal" @input="calcMulti"/></div>
                <div><label>實付金額 $</label><input v-model.number="formMulti.realPayTWD" type="number" inputmode="decimal" @input="calcMulti"/></div>
              </div>
              <div class="row row-4">
                <div>
                  <label>付款方式</label>
                  <select v-model="formMulti.payMethod" @change="handleSel('payMethod','multi')">
                    <option v-for="o in store.selectOpts.payMethod" :key="o">{{o}}</option>
                    <option value="__other__">其他</option>
                  </select>
                  <input v-if="formMulti.payMethod==='__other__'" v-model="formMulti.payMethodOther" placeholder="輸入新付款方式"/>
                </div>
                <div><label>預計刷卡手續費 $</label><input v-model.number="formMulti.cardFeeTWD" readonly/></div>
                <div><label>匯率</label><input v-model.number="formMulti.rate" readonly/></div>
                <div><label>實際利潤 $</label><input v-model.number="formMulti.profitTWD" readonly/></div>
              </div>
              <div class="sub-title">客戶入帳資料</div>
              <div class="row row-4">
                <div><label>實收金額 $</label><input v-model.number="formMulti.receiveTWD" type="number" inputmode="decimal" @input="calcMulti"/></div>
                <div>
                  <label>收款來源</label>
                  <select v-model="formMulti.receiveSource" @change="handleSel('receiveSource','multi')">
                    <option v-for="o in store.selectOpts.receiveSource" :key="o">{{o}}</option>
                    <option value="__other__">其他</option>
                  </select>
                  <input v-if="formMulti.receiveSource==='__other__'" v-model="formMulti.receiveSourceOther" placeholder="輸入新收款來源"/>
                </div>
                <div><label>末五碼</label><input v-model="formMulti.last5Code"/></div>
                <div><label>收款日期</label><input v-model="formMulti.receiveDate" type="date"/></div>
              </div>
              <div class="row row-2">
                <div>
                  <label>下單平台</label>
                  <select v-model="formMulti.platform" @change="handleSel('platform','multi')">
                    <option v-for="o in store.selectOpts.platform" :key="o">{{o}}</option>
                    <option value="__other__">其他</option>
                  </select>
                  <input v-if="formMulti.platform==='__other__'" v-model="formMulti.platformOther" placeholder="輸入新平台"/>
                </div>
                <div class="autocomplete-wrap">
                  <label>店面名稱</label>
                  <input v-model="formMulti.shopName" @input="filterSug('shopName','multi')" @blur="hideSug"/>
                  <div class="suggest-list" v-if="sugShow.shopName && sugList.shopName.length">
                    <div class="suggest-item" v-for="s in sugList.shopName" @click="pickSug('shopName','multi',s)">{{s}}</div>
                  </div>
                </div>
              </div>
              <div class="form-title">照片</div>
              <div class="upload-box">📷
                <input type="file" multiple accept="image/*" @change="uploadImg($event,'multi')"/>
              </div>
              <div class="img-preview">
                <img v-for="(i,idx) in formMulti.imgs" :key="idx" :src="i" @click="previewImg(i)" style="cursor:pointer"/>
              </div>
              <div class="form-title">備註</div>
              <input v-model="formMulti.remark"/>
              <div style="margin-top:14px;display:flex;gap:8px;">
                <button class="btn btn-add" @click="saveMulti">儲存</button>
                <button class="btn" style="background:#ccc" @click="modalShow=false">取消</button>
              </div>
            </div>
            <div class="collapse-header collapse-exchange" @click="tabExchange=!tabExchange">帳務｜儲值/換匯 <span>{{tabExchange?'−':'+'}}</span></div>
            <div v-if="tabExchange">
              <div class="row row-2">
                <div><label>交易日期</label><input v-model="formEx.tradeDate" type="date"/></div>
                <div></div>
              </div>
              <div class="row row-3">
                <div><label>支付金額 ¥</label><input v-model.number="formEx.payCNY" type="number" inputmode="decimal" @input="calcEx"/></div>
                <div><label>支付金額 $</label><input v-model.number="formEx.payTWD" type="number" inputmode="decimal" @input="calcEx"/></div>
              </div>
              <div class="row row-3">
                <div><label>刷卡手續 $</label><input v-model.number="formEx.exchangeFeeTWD" readonly/></div>
                <div><label>匯率</label><input v-model.number="formEx.rate" readonly/></div>
              </div>
              <div class="row row-2">
                <div>
                  <label>對方</label>
                  <select v-model="formEx.targetUser" @change="handleSel('targetUser','ex')">
                    <option v-for="o in store.selectOpts.targetUser" :key="o">{{o}}</option>
                    <option value="__other__">其他</option>
                  </select>
                  <input v-if="formEx.targetUser==='__other__'" v-model="formEx.targetUserOther" placeholder="輸入新對方"/>
                </div>
                <div>
                  <label>用途</label>
                  <select v-model="formEx.purpose" @change="handleSel('purpose','ex')">
                    <option v-for="o in store.selectOpts.purpose" :key="o">{{o}}</option>
                    <option value="__other__">其他</option>
                  </select>
                  <input v-if="formEx.purpose==='__other__'" v-model="formEx.purposeOther" placeholder="輸入新用途"/>
                </div>
              </div>
              <div style="margin-top:14px;display:flex;gap:8px;">
                <button class="btn btn-add" @click="saveEx">儲存</button>
                <button class="btn" style="background:#ccc" @click="modalShow=false">取消</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    `,
    setup(){
      const store = useRecordStore();
      const modalShow = ref(false);
      const tabSingle = ref(true);
      const tabMulti = ref(false);
      const tabExchange = ref(false);
      const editId = ref("");
      const sugShow = reactive({orderAccount:false,dramaTag:false,shopName:false});
      const sugList = reactive({orderAccount:[],dramaTag:[],shopName:[]});
      const today = new Date().toISOString().split('T')[0];
      const formSingle = reactive({
        id:"",recordType:"single",orderAccount:"",orderDate:today,dramaTag:"",productName:"",style:"",qty:1,
        originalCNY:0,realPayCNY:0,realPayTWD:0,payMethod:"",payMethodOther:"",cardFeeTWD:0,rate:0,profitTWD:0,
        receiveTWD:0,receiveSource:"",receiveSourceOther:"",last5Code:"",receiveDate:today,platform:"",platformOther:"",
        shopName:"",imgs:[],remark:""
      })
      const formMulti = reactive({
        id:"",recordType:"multi",orderAccount:"",orderDate:today,dramaTag:"",productName:"",style:"",qty:1,
        originalCNY:0,realPayCNY:0,realPayTWD:0,payMethod:"",payMethodOther:"",cardFeeTWD:0,rate:0,profitTWD:0,
        receiveTWD:0,receiveSource:"",receiveSourceOther:"",last5Code:"",receiveDate:today,platform:"",platformOther:"",
        shopName:"",imgs:[],remark:""
      })
      const formEx = reactive({
        id:"",recordType:"exchange",tradeDate:today,payCNY:0,payTWD:0,exchangeFeeTWD:0,rate:0,targetUser:"",targetUserOther:"",purpose:"",purposeOther:""
      })
      function openModal(){
        editId.value="";
        resetForm();
        modalShow.value=true;
      }
      function resetForm(){
        const t = new Date().toISOString().split('T')[0];
        Object.assign(formSingle,{id:"",recordType:"single",orderAccount:"",orderDate:t,dramaTag:"",productName:"",style:"",qty:1,
          originalCNY:0,realPayCNY:0,realPayTWD:0,payMethod:"",payMethodOther:"",cardFeeTWD:0,rate:0,profitTWD:0,
          receiveTWD:0,receiveSource:"",receiveSourceOther:"",last5Code:"",receiveDate:t,platform:"",platformOther:"",shopName:"",imgs:[],remark:""})
        Object.assign(formMulti,{id:"",recordType:"multi",orderAccount:"",orderDate:t,dramaTag:"",productName:"",style:"",qty:1,
          originalCNY:0,realPayCNY:0,realPayTWD:0,payMethod:"",payMethodOther:"",cardFeeTWD:0,rate:0,profitTWD:0,
          receiveTWD:0,receiveSource:"",receiveSourceOther:"",last5Code:"",receiveDate:t,platform:"",platformOther:"",shopName:"",imgs:[],remark:""})
        Object.assign(formEx,{id:"",recordType:"exchange",tradeDate:t,payCNY:0,payTWD:0,exchangeFeeTWD:0,rate:0,targetUser:"",targetUserOther:"",purpose:"",purposeOther:""})
      }
      function editRec(r){
        editId.value=r.id;
        if(r.recordType==='single'){
          Object.assign(formSingle,JSON.parse(JSON.stringify(r)));
          tabSingle.value=true;tabMulti.value=false;tabExchange.value=false;
        }else if(r.recordType==='multi'){
          Object.assign(formMulti,JSON.parse(JSON.stringify(r)));
          tabSingle.value=false;tabMulti.value=true;tabExchange.value=false;
        }else{
          Object.assign(formEx,JSON.parse(JSON.stringify(r)));
          tabSingle.value=false;tabMulti.value=false;tabExchange.value=true;
        }
        modalShow.value=true;
      }
      function calcSingle(){
        const ft = Number(formSingle.realPayTWD||0);
        const fy = Number(formSingle.realPayCNY||0);
        const rt = Number(formSingle.receiveTWD||0);
        formSingle.cardFeeTWD = Math.round(ft*0.015);
        formSingle.rate = fy===0 ? 0 : ft/fy;
        formSingle.profitTWD = rt - (ft + formSingle.cardFeeTWD);
      }
      function calcMulti(){
        const ft = Number(formMulti.realPayTWD||0);
        const fy = Number(formMulti.realPayCNY||0);
        const rt = Number(formMulti.receiveTWD||0);
        formMulti.cardFeeTWD = Math.round(ft*0.015);
        formMulti.rate = fy===0 ? 0 : ft/fy;
        formMulti.profitTWD = rt - (ft + formMulti.cardFeeTWD);
      }
      function calcEx(){
        const pt = Number(formEx.payTWD||0);
        const py = Number(formEx.payCNY||0);
        formEx.exchangeFeeTWD = Math.round(pt*0.015);
        formEx.rate = py===0 ? 0 : pt/py;
      }
      function handleSel(key,type){
        let f = type==='single'?formSingle:type==='multi'?formMulti:formEx;
        if(f[key]==='__other__'){
          f[key] = f[key+"Other"] || "";
        }else{
          f[key+"Other"] = "";
        }
      }
      function filterSug(key,type){
        const f = type==='single'?formSingle:type==='multi'?formMulti:formEx;
        const kw = f[key].toLowerCase();
        sugList[key] = store.suggestion[key].filter(x=>x.toLowerCase().includes(kw));
        sugShow[key]=true;
      }
      function hideSug(){setTimeout(()=>{sugShow.orderAccount=false;sugShow.dramaTag=false;sugShow.shopName=false},200)}
      function pickSug(key,type,val){
        const f = type==='single'?formSingle:type==='multi'?formMulti:formEx;
        f[key]=val;sugShow[key]=false;
      }
      function uploadImg(e,type){
        const files = e.target.files;
        const fr = new FileReader();
        for(let f of files){
          const reader = new FileReader();
          reader.onload = ev=>{
            if(type==='single') formSingle.imgs.push(ev.target.result);
            if(type==='multi') formMulti.imgs.push(ev.target.result);
          }
          reader.readAsDataURL(f);
        }
      }
      function previewImg(src){window.open(src)}
      function saveSingle(){
        const rec = JSON.parse(JSON.stringify(formSingle));
        if(rec.payMethod==='__other__') rec.payMethod = rec.payMethodOther;
        if(rec.receiveSource==='__other__') rec.receiveSource = rec.receiveSourceOther;
        if(rec.platform==='__other__') rec.platform = rec.platformOther;
        if(editId.value){
          rec.id=editId.value;store.updateRecord(editId.value,rec);
        }else{
          rec.id = crypto.randomUUID();store.addRecord(rec);
        }
        modalShow.value=false;
      }
      function saveMulti(){
        const rec = JSON.parse(JSON.stringify(formMulti));
        if(rec.payMethod==='__other__') rec.payMethod = rec.payMethodOther;
        if(rec.receiveSource==='__other__') rec.receiveSource = rec.receiveSourceOther;
        if(rec.platform==='__other__') rec.platform = rec.platformOther;
        if(editId.value){
          rec.id=editId.value;store.updateRecord(editId.value,rec);
        }else{
          rec.id = crypto.randomUUID();store.addRecord(rec);
        }
        modalShow.value=false;
      }
      function saveEx(){
        const rec = JSON.parse(JSON.stringify(formEx));
        if(rec.targetUser==='__other__') rec.targetUser = rec.targetUserOther;
        if(rec.purpose==='__other__') rec.purpose = rec.purposeOther;
        if(editId.value){
          rec.id=editId.value;store.updateRecord(editId.value,rec);
        }else{
          rec.id = crypto.randomUUID();store.addRecord(rec);
        }
        modalShow.value=false;
      }
      onMounted(()=>store.load())
      return {store,modalShow,tabSingle,tabMulti,tabExchange,formSingle,formMulti,formEx,openModal,editRec,calcSingle,calcMulti,calcEx,handleSel,filterSug,sugList,sugShow,pickSug,hideSug,uploadImg,previewImg,saveSingle,saveMulti,saveEx}
    }
  }},
  {path:'/finance',component:{
    template:`
      <div>
        <div class="nav-bar">
          <button class="nav-btn" @click="$router.push('/expense')">代購記帳</button>
          <button class="nav-btn active">財務表</button>
        </div>
        <div class="finance-filter">
          <label>查詢範圍：</label>
          <select v-model="filterMode">
            <option value="all">全部資料</option>
            <option value="range">自訂區間</option>
          </select>
          <input v-if="filterMode==='range'" v-model="startDate" type="date"/>
          <span v-if="filterMode==='range'">～</span>
          <input v-if="filterMode==='range'" v-model="endDate" type="date"/>
        </div>
        <div class="card">
          <div>總筆數：{{listFilter.length}}</div>
          <div>合計實付¥：{{sumCNY.toFixed(2)}}</div>
          <div>合計實付$+手續$：{{sumTWD.toFixed(2)}}</div>
        </div>
        <div v-for="r in listFilter" :key="r.id" class="record-item">
          {{r.orderAccount||r.tradeDate}}｜{{r.recordType}}｜{{r.productName||r.purpose}}｜¥{{r.realPayCNY}} ${{r.realPayTWD}} 手續${{r.cardFeeTWD||r.exchangeFeeTWD}}
        </div>
      </div>
    `,
    setup(){
      const store = useRecordStore();
      const filterMode = ref('all');
      const startDate = ref('');
      const endDate = ref('');
      const listFilter = computed(()=>{
        if(filterMode.value==='all') return store.recordList;
        return store.recordList.filter(x=>{
          const d = new Date(x.orderDate || x.tradeDate);
          return d >= new Date(startDate.value) && d <= new Date(endDate.value);
        })
      })
      const sumCNY = computed(()=>listFilter.value.reduce((s,i)=>s+Number(i.realPayCNY||0)+Number(i.payCNY||0),0))
      const sumTWD = computed(()=>listFilter.value.reduce((s,i)=>s + (Number(i.realPayTWD||0)+Number(i.cardFeeTWD||0)+Number(i.payTWD||0)+Number(i.exchangeFeeTWD||0)),0))
      return {store,filterMode,startDate,endDate,listFilter,sumCNY,sumTWD}
    }
  }}
]
const router = createRouter({history:createWebHashHistory(),routes})
const pinia = createPinia();
const app = createApp({});
app.use(pinia);
app.use(router);
app.mount('#app');
</script>
</html>
