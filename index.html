<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>代購記帳</title>
<style>
:root{
  --main-purple:#e9e4f5;
  --purple-dark:#b8aed8;
  --blue-light:#c8d8f0;
  --green-light:#d0e9dd;
  --text:#333;
  --bg:white;
  --border:#ddd;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, sans-serif;}
body{background:var(--main-purple);color:var(--text);padding:12px;}
.container{max-width:900px;margin:0 auto;background:var(--bg);border-radius:16px;padding:16px;box-shadow:0 2px 8px #00000012;}
h1{text-align:center;margin-bottom:16px;color:#7b68a8;font-size:22px;}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
.stat-card{padding:12px;border-radius:12px;background:var(--main-purple);text-align:center;font-weight:bold;}

/* 搜尋列樣式 */
.search-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding:10px;border:1px solid #eee;border-radius:10px;}

/* 折疊面板 */
.collapse-wrap{margin-bottom:16px;border:1px solid #eee;border-radius:10px;overflow:hidden;}
.collapse-header{padding:10px 14px;background:#f4f1fa;cursor:pointer;font-weight:bold;display:flex;justify-content:space-between;align-items:center;}
.collapse-content{padding:12px;display:none;}
.collapse-content.open{display:block;}

.btn-group{display:flex;gap:8px;flex-wrap:wrap;}
button{padding:10px 14px;border:none;border-radius:10px;cursor:pointer;font-size:15px;}
.btn-add{background:#947fc7;color:white;font-weight:bold;}
.btn-mode1{background:var(--blue-light);}
.btn-mode2{background:var(--green-light);}

.filter-bar{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-top:12px;border-top:1px solid #eee;}
.form-wrap{display:none;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:16px;}
.form-wrap.active{display:block;}
.form-row{display:grid;gap:10px;margin-bottom:10px;align-items:end;}
.row-2col{grid-template-columns:1fr 1fr;}
.row-4col{grid-template-columns:1.2fr 2fr 0.8fr 0.8fr;}
.row-3col{grid-template-columns:1fr 1fr 1fr;}
.row-4short{grid-template-columns:1fr 1fr 1fr 1fr;}
.row-2short{grid-template-columns:1fr 1fr;}
label{font-size:14px;display:block;margin-bottom:4px;}
input,select{width:100%;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:15px;}
input[type="number"]{inputmode:decimal;}
.auto-suggest{position:relative;}
.suggest-list{position:absolute;background:white;border:1px solid #ddd;border-radius:0 0 8px 8px;z-index:99;top:100%;left:0;right:0;max-height:160px;overflow-y:auto;display:none;}
.suggest-item{padding:8px 10px;cursor:pointer;}
.suggest-item:hover{background:#f2f0fa;}
.photo-area{margin:10px 0;}
.photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.photo-preview img{width:80px;height:80px;object-fit:cover;border-radius:6px;}
.item-card{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:10px;}
.item-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.item-actions button{padding:6px 8px;font-size:13px;margin-left:4px;}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:14px;}
th,td{border:1px solid #eee;padding:8px;text-align:left;}
th{background:var(--main-purple);}
.sub-title{font-weight:bold;color:#7b68a8;margin:12px 0 6px 0;font-size:15px;}
@media(max-width:600px){
  .stat-row{grid-template-columns:1fr;}
  .form-row{grid-template-columns:1fr !important;}
}
/* ===== 多品項商品組樣式 ===== */
.multi-group-wrap{
  border:1px solid #e2e8f0;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
}
.multi-item-row{
  display:grid;
  grid-template-columns:1.2fr 2fr 0.8fr 0.8fr;
  gap:8px;
  margin-bottom:8px;
  align-items:end;
}
.btn-add-row{
  opacity:0.7;
  background:#947fc7;
  color:#fff;
  margin-top:6px;
}
.btn-del-row{
  background:#e57373;
  color:white;
  padding:7px;
}
</style>
</head>
<body>
<div class="container">
  <h1>代購記帳</h1>
  <div class="stat-row">
    <div class="stat-card">本月總支出¥ <span id="sumCny">0.00</span></div>
    <div class="stat-card">本月總支出$ <span id="sumTwd">0</span></div>
  </div>

  <!-- ✅ 關鍵字搜尋移到本月支出下方 -->
  <div class="search-bar">
    <label>關鍵字搜尋</label>
    <input type="text" id="searchInput" placeholder="商品、人劇綜、訂購帳號、備註..." oninput="doSearch()">
    <button onclick="clearSearch()">清除搜尋</button>
  </div>

  <!-- ✅ 新增帳務區塊：可展開/收回，預設收起 -->
  <div class="collapse-wrap">
    <div class="collapse-header" onclick="toggleCollapse()">
      <span>新增帳務（點擊展開/收合）</span>
      <span id="collapseArrow">▼</span>
    </div>
    <div class="collapse-content" id="addBtnArea">
      <div class="btn-group">
        <button class="btn-add" onclick="openForm('normal')">新增帳務｜單品項</button>
        <button class="btn-mode1" onclick="openForm('multi')">新增帳務｜多品項</button>
        <button class="btn-mode2" onclick="openForm('exch')">新增帳務｜儲值/換匯</button>
      </div>
    </div>
  </div>

  <!-- 單品表單 -->
  <div id="formMain" class="form-wrap">
    <input type="hidden" id="editId">
    <input type="hidden" id="currentSubMode">
    <!-- 訂購帳號、訂購日期 -->
    <div class="form-row row-2col">
      <div class="auto-suggest">
        <label>訂購帳號</label>
        <input type="text" id="orderNo" oninput="showSuggest('orderNo', this.value)">
        <div class="suggest-list" id="suggest-orderNo"></div>
      </div>
      <div>
        <label>訂購日期</label>
        <input type="date" id="orderDate">
      </div>
    </div>

    <!-- 單品模式：人劇綜、商品名稱、款式、數量 -->
    <div id="singleProductBlock">
      <div class="form-row row-4col">
        <div class="auto-suggest">
          <label>人劇綜</label>
          <input type="text" id="artist" oninput="showSuggest('artist', this.value)">
          <div class="suggest-list" id="suggest-artist"></div>
        </div>
        <div>
          <label>商品名稱</label>
          <input type="text" id="prodName">
        </div>
        <div>
          <label>款式</label>
          <input type="text" id="style">
        </div>
        <div>
          <label>數量</label>
          <input type="number" id="qty" min="0" step="1">
        </div>
      </div>
    </div>

    <!-- 多品模式：動態多組商品 -->
    <div id="multiProductBlock" class="multi-group-wrap" style="display:none;">
      <label>商品清單</label>
      <div id="multiRowsWrap"></div>
      <button type="button" class="btn-add-row" onclick="addMultiRow()">+ 新增一組商品</button>
    </div>

    <!-- 原人民幣、實付人民幣、實付台幣 -->
    <div class="form-row row-3col">
      <div>
        <label>原金額¥</label>
        <input type="number" id="oriCny" step="0.01" inputmode="decimal">
      </div>
      <div>
        <label>實付金額¥</label>
        <input type="number" id="payCny" step="0.01" inputmode="decimal" oninput="calcMain()">
      </div>
      <div>
        <label>實付金額$</label>
        <input type="number" id="payTwd" step="0.01" inputmode="decimal" oninput="calcMain()">
      </div>
    </div>
    <!-- 手續費、匯率、利潤 -->
    <div class="form-row row-3col">
      <div>
        <label>預計刷卡手續費$</label>
        <input type="number" id="feeTwd" readonly>
      </div>
      <div>
        <label>匯率</label>
        <input type="number" id="rate" readonly step="0.01">
      </div>
      <div>
        <label>實際利潤$</label>
        <input type="number" id="profitTwd" readonly>
      </div>
    </div>

    <div class="sub-title">客人入帳</div>
    <!-- 實收、收款來源、末五碼、收款日期 -->
    <div class="form-row row-4short">
      <div>
        <label>實收金額$</label>
        <input type="number" id="recvTwd" step="0.01" inputmode="decimal" oninput="calcMain()">
      </div>
      <div>
        <label>收款來源</label>
        <select id="recvSource" onchange="otherSelect(this,'recvSource')"></select>
      </div>
      <div>
        <label>末五碼</label>
        <input type="number" id="last5" inputmode="numeric">
      </div>
      <div>
        <label>收款日期</label>
        <input type="date" id="recvDate">
      </div>
    </div>

    <!-- 下單平台、店面名稱 -->
    <div class="form-row row-2col">
      <div>
        <label>下單平台</label>
        <select id="platform" onchange="otherSelect(this,'platform')"></select>
      </div>
      <div class="auto-suggest">
        <label>店面名稱</label>
        <input type="text" id="shopName" oninput="showSuggest('shopName', this.value)">
        <div class="suggest-list" id="suggest-shopName"></div>
      </div>
    </div>

    <div class="photo-area">
      <label>照片</label>
      <input type="file" id="photoInput" accept="image/*" multiple onchange="uploadPhoto()">
      <div class="photo-preview" id="photoPreview"></div>
      <input type="hidden" id="photoArr">
    </div>
    <div>
      <label>備註</label>
      <input type="text" id="remark">
    </div>
    <div class="btn-group" style="margin-top:12px;">
      <button onclick="saveItem()">儲存</button>
      <button onclick="closeForm()">取消</button>
    </div>
  </div>

  <!-- 儲值換匯表單 -->
  <div id="formExch" class="form-wrap">
    <input type="hidden" id="editIdExch">
    <div class="form-row row-3col">
      <div>
        <label>交易日期</label>
        <input type="date" id="exchDate">
      </div>
      <div>
        <label>支付金額¥</label>
        <input type="number" id="exchCny" step="0.01" inputmode="decimal" oninput="calcExch()">
      </div>
      <div>
        <label>支付金額$</label>
        <input type="number" id="exchTwd" step="0.01" inputmode="decimal" oninput="calcExch()">
      </div>
    </div>
    <div class="form-row row-2col">
      <div>
        <label>刷卡手續$</label>
        <input type="number" id="exchFee" readonly>
      </div>
      <div>
        <label>匯率</label>
        <input type="number" id="exchRate" readonly step="0.0001">
      </div>
    </div>
    <div class="btn-group" style="margin-top:12px;">
      <button onclick="saveExch()">儲存</button>
      <button onclick="closeForm()">取消</button>
    </div>
  </div>

  <div id="listWrap"></div>

  <!-- 彙整區間留在最底部 -->
  <div class="filter-bar">
    <label>彙整區間</label>
    <input type="date" id="startDate">
    <input type="date" id="endDate">
    <button onclick="renderAll()">全部資料</button>
    <button onclick="renderRange()">區間彙整</button>
  </div>
</div>

<script>
// ========== 折疊控制 ==========
let collapseOpen = false;
function toggleCollapse(){
  collapseOpen = !collapseOpen;
  const area = document.getElementById("addBtnArea");
  const arrow = document.getElementById("collapseArrow");
  if(collapseOpen){
    area.classList.add("open");
    arrow.textContent = "▲";
  }else{
    area.classList.remove("open");
    arrow.textContent = "▼";
  }
}

// ========== 基礎常數、預設選單 ==========
const STORAGE_KEY = "代购BookData";
const BASE_RECV_SOURCE = ["中信$","郵局$","中信無卡$","台新$","台新無卡$","國泰$","台灣配$","LINE BANK","i pass money","line pay money"];
const BASE_PLATFORM = ["淘寶","淘寶（騰訊）","淘寶（優酷）","淘寶（愛奇藝）","騰訊","優酷","愛奇藝","小芒","微店","微信（拼團呀）","微信（拼谷）","閑魚","小紅書","抖音","京東","QQ音樂","酷狗音樂","網易雲","拼多多","阿里巴巴","微博","紛玩島","大麥","百度網盤"];
const BASE_PAYWAY = ["支付寶¥-中信","支付寶¥-國泰","支付寶-¥餘額","微信¥-中信","微信¥-國泰","微信-¥餘額","中信$","郵局$","台新$","國泰$","台灣配$"];

let data = {
  products:[],
  history:{
    orderNo:[],
    artist:[],
    shopName:[],
    recvSource:[...BASE_RECV_SOURCE],
    platform:[...BASE_PLATFORM],
    payWay:[...BASE_PAYWAY]
  }
};
let searchKeyword = "";

// 多品項暫存陣列
let multiRows = [];

// ========== 舊資料遷移 Migrate（相容判斷） ==========
function loadData(){
  const raw = localStorage.getItem(STORAGE_KEY);
  if(raw){
    try{
      const old = JSON.parse(raw);
      // 判斷是舊格式（舊expense陣列）
      if(Array.isArray(old) && old.length>0 && !old.products){
        data.products = old.map(item=>{
          return {
            type:"migrated",
            orderDate:item.date||"",
            orderNo:item.orderNo||"",
            artist:item.artist||"",
            prodName:item.name||"",
            style:item.style||"",
            qty:item.qty||1,
            multiItems: null,
            oriCny:item.oriCny||0,
            payCny:item.cny||0,
            payTwd:item.twd||0,
            recvTwd:item.recvTwd||0,
            last5:item.last5||"",
            feeTwd:Math.round((item.recvTwd||0)*0.015),
            profitTwd: (item.recvTwd||0) - ((item.twd||0)+Math.round((item.recvTwd||0)*0.015)),
            rate: item.payCny>0 ? Number((item.twd/item.cny).toFixed(2)) : 0,
            recvSource:item.recvSource||"",
            recvDate:item.recvDate||"",
            platform:item.platform||"",
            shopName:item.shopName||"",
            photos:item.photos||[],
            remark:item.remark||""
          }
        })
      }else if(old.products){
        data = old;
      }
    }catch(e){console.error(e);}
  }
  fillSelect("recvSource");
  fillSelect("platform");
  renderAll();
}
function saveStorage(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

// ========== 下拉選單 ==========
function fillSelect(key){
  const sel = document.getElementById(key);
  if(!sel) return;
  sel.innerHTML = "";
  data.history[key].forEach(v=>{
    const opt = document.createElement("option");opt.value=v;opt.innerText=v;sel.appendChild(opt);
  })
  const optOther = document.createElement("option");opt.value="_OTHER_";opt.innerText="其他";sel.appendChild(optOther);
}
function otherSelect(el, key){
  if(el.value === "_OTHER_"){
    const val = prompt("輸入新選項：");
    if(val && val.trim()){
      const v = val.trim();
      if(!data.history[key].includes(v)) data.history[key].push(v);
      fillSelect(key);
      el.value = v;
      saveStorage();
    }
  }
}

// ========== 自動建議下拉 ==========
function showSuggest(key, val){
  const wrap = document.getElementById("suggest-"+key);
  wrap.innerHTML="";
  if(!val.trim()){wrap.style.display="none";return;}
  const list = data.history[key]||[];
  const match = list.filter(x=>x.toLowerCase().includes(val.toLowerCase()));
  if(match.length===0){wrap.style.display="none";return;}
  match.forEach(t=>{
    const div = document.createElement("div");div.className="suggest-item";div.innerText=t;
    div.onclick=()=>{document.getElementById(key).value=t;wrap.style.display="none";};
    wrap.appendChild(div);
  })
  wrap.style.display="block";
}
function pushHistory(key, val){
  if(!val||!val.trim()) return;
  const v = val.trim();
  if(!data.history[key]) data.history[key]=[];
  if(!data.history[key].includes(v)) data.history[key].push(v);
}

// ========== 自動計算【依照你給的新公式】 ==========
// 預計刷卡手續費$ = 實收台幣 * 0.015，四捨五入整數
// 匯率 = 實付台幣 / 實付人民幣，四捨五入小數後2位
function calcMain(){
  const recvTwd = Number(document.getElementById("recvTwd").value||0);
  const payTwd = Number(document.getElementById("payTwd").value||0);
  const payCny = Number(document.getElementById("payCny").value||0);

  const fee = Math.round(recvTwd * 0.015);
  const rate = payCny > 0 ? Number((payTwd / payCny).toFixed(2)) : 0;
  const profit = recvTwd - (payTwd + fee);

  document.getElementById("feeTwd").value = fee;
  document.getElementById("rate").value = rate;
  document.getElementById("profitTwd").value = profit;
}
function calcExch(){
  const exchTwd = Number(document.getElementById("exchTwd").value||0);
  const exchCny = Number(document.getElementById("exchCny").value||0);
  const fee = Math.round(exchTwd * 0.015);
  const rate = exchCny>0 ? (exchTwd / exchCny).toFixed(4) : "";
  document.getElementById("exchFee").value = fee;
  document.getElementById("exchRate").value = rate;
}

// ========== 多品項動態列 ==========
function renderMultiRows(){
  const wrap = document.getElementById("multiRowsWrap");
  wrap.innerHTML = "";
  multiRows.forEach((rowData, idx)=>{
    const div = document.createElement("div");
    div.className = "multi-item-row";
    div.innerHTML = `
      <input type="text" placeholder="人劇綜" value="${rowData.artist||''}" onchange="updateMultiRow(${idx},'artist',this.value)">
      <input type="text" placeholder="商品名稱" value="${rowData.name||''}" onchange="updateMultiRow(${idx},'name',this.value)">
      <input type="text" placeholder="款式" value="${rowData.style||''}" onchange="updateMultiRow(${idx},'style',this.value)">
      <input type="number" min="0" step="1" placeholder="數量" value="${rowData.qty||''}" onchange="updateMultiRow(${idx},'qty',Number(this.value))">
      <button class="btn-del-row" onclick="delMultiRow(${idx})">刪</button>
    `;
    wrap.appendChild(div);
  })
}
function addMultiRow(){
  multiRows.push({artist:"", name:"", style:"", qty:""});
  renderMultiRows();
}
function updateMultiRow(idx, key, val){
  multiRows[idx][key] = val;
}
function delMultiRow(idx){
  multiRows.splice(idx,1);
  renderMultiRows();
}

// ========== 照片上傳 ==========
let tempPhotos = [];
function uploadPhoto(){
  const files = document.getElementById("photoInput").files;
  for(let f of files){
    const r = new FileReader();
    r.onload = e=>{
      tempPhotos.push(e.target.result);
      renderPhotoPreview();
    }
    r.readAsDataURL(f);
  }
}
function renderPhotoPreview(){
  const wrap = document.getElementById("photoPreview");wrap.innerHTML="";
  tempPhotos.forEach((src,i)=>{
    const img = document.createElement("img");img.src=src;
    img.onclick=()=>{tempPhotos.splice(i,1);renderPhotoPreview();}
    wrap.appendChild(img);
  })
  document.getElementById("photoArr").value = JSON.stringify(tempPhotos);
}

// ========== 表單開關、新增/編輯 ==========
let currMode = "";
function openForm(mode){
  closeForm();
  currMode = mode;
  document.getElementById("currentSubMode").value = mode;
  const today = new Date().toISOString().split("T")[0];
  if(mode==="normal" || mode==="multi"){
    document.getElementById("formMain").classList.add("active");
    document.getElementById("orderDate").value = today;
    document.getElementById("recvDate").value = today;
    tempPhotos=[];renderPhotoPreview();
    document.getElementById("editId").value="";
    document.getElementById("last5").value="";

    if(mode === "normal"){
      document.getElementById("singleProductBlock").style.display="block";
      document.getElementById("multiProductBlock").style.display="none";
      multiRows = [];
    }else{
      document.getElementById("singleProductBlock").style.display="none";
      document.getElementById("multiProductBlock").style.display="block";
      multiRows = [{artist:"", name:"", style:"", qty:""}];
      renderMultiRows();
    }
  }else if(mode==="exch"){
    document.getElementById("formExch").classList.add("active");
    document.getElementById("exchDate").value = today;
    document.getElementById("editIdExch").value="";
  }
}
function closeForm(){
  document.querySelectorAll(".form-wrap").forEach(x=>x.classList.remove("active"));
  currMode="";
}
function saveItem(){
  const subMode = document.getElementById("currentSubMode").value;
  let prodNameVal = "";
  let styleVal = "";
  let qtyVal = 0;
  let artistVal = "";
  let multiItemsSave = null;

  if(subMode === "normal"){
    artistVal = document.getElementById("artist").value;
    prodNameVal = document.getElementById("prodName").value;
    styleVal = document.getElementById("style").value;
    qtyVal = Number(document.getElementById("qty").value||0);
  }else{
    multiItemsSave = JSON.parse(JSON.stringify(multiRows));
  }

  const obj = {
    type: subMode,
    orderDate:document.getElementById("orderDate").value,
    orderNo:document.getElementById("orderNo").value,
    artist: artistVal,
    prodName: prodNameVal,
    style: styleVal,
    qty: qtyVal,
    multiItems: multiItemsSave,
    oriCny:Number(document.getElementById("oriCny").value||0),
    payCny:Number(document.getElementById("payCny").value||0),
    payTwd:Number(document.getElementById("payTwd").value||0),
    feeTwd:Number(document.getElementById("feeTwd").value||0),
    profitTwd:Number(document.getElementById("profitTwd").value||0),
    rate:Number(document.getElementById("rate").value||0),
    recvTwd:Number(document.getElementById("recvTwd").value||0),
    last5:document.getElementById("last5").value,
    recvSource:document.getElementById("recvSource").value,
    recvDate:document.getElementById("recvDate").value,
    platform:document.getElementById("platform").value,
    shopName:document.getElementById("shopName").value,
    photos:tempPhotos,
    remark:document.getElementById("remark").value
  }
  pushHistory("orderNo", obj.orderNo);
  pushHistory("artist", obj.artist);
  pushHistory("shopName", obj.shopName);
  pushHistory("recvSource", obj.recvSource);
  pushHistory("platform", obj.platform);
  const eid = document.getElementById("editId").value;
  if(eid){
    data.products[eid] = obj;
  }else{
    data.products.push(obj);
  }
  saveStorage();
  closeForm();
  renderAll();
}
function saveExch(){
  const obj = {

    exchDate:document.getElementById("exchDate").value,
    exchCny:Number(document.getElementById("exchCny").value||0),

  }

  }

  closeForm();
  renderAll();
}

// ========== 搜尋功能 ==========
function doSearch(){
  searchKeyword = document.getElementById("searchInput").value.trim().toLowerCase();
  renderAll();
}
function clearSearch(){
  document.getElementById("searchInput").value = "";
  searchKeyword = "";
  renderAll();
}
function filterByKeyword(list){
  if(!searchKeyword) return list;
  return list.filter(it=>{
    let textPool = "";
    textPool += (it.orderDate||"") + (it.orderNo||"") + (it.artist||"") + (it.prodName||"") + (it.style||"") + (it.remark||"") + (it.shopName||"") + (it.platform||"") + (it.last5||"");
    if(Array.isArray(it.multiItems)){
      it.multiItems.forEach(p=>{
        textPool += (p.artist||"") + (p.name||"") + (p.style||"");
      })
    }
    if(it.type==="exch") textPool += it.exchDate||"";
    return textPool.toLowerCase().includes(searchKeyword);
  })
}

// ========== 渲染清單 + 統計 ==========
function calcSum(list){
  let sumCny = 0, sumTwd = 0;
  list.forEach(it=>{
    if(it.type!=="exch"){
      sumCny += Number(it.payCny||0);
      sumTwd += (Number(it.payTwd||0)+Number(it.feeTwd||0));
    }
  })
  document.getElementById("sumCny").innerText = sumCny.toFixed(2);
  document.getElementById("sumTwd").innerText = Math.round(sumTwd);
}

          <div>

          </div>
        </div>

function renderAll(){
  let list = filterByKeyword([...data.products]);
  calcSum(list);
  renderItems(list);
}
function renderRange(){
  const s = document.getElementById("startDate").value;
  const e = document.getElementById("endDate").value;
  if(!s || !e) return alert("請選起訖日期");
  let filtered = data.products.filter(x=>{
    const d = x.type==="exch" ? x.exchDate : x.orderDate;
    return d >= s && d <= e;
  })
  filtered = filterByKeyword(filtered);
  calcSum(filtered);
  renderItems(filtered);
}
function editItem(idx){
  const it = data.products[idx];
  if(it.type==="exch"){
    openForm("exch");
    document.getElementById("editIdExch").value=idx;
    document.getElementById("exchDate").value=it.exchDate;
    document.getElementById("exchCny").value=it.exchCny;
    document.getElementById("exchTwd").value=it.exchTwd;
    calcExch();
  }else if(it.type === "multi"){
    openForm("multi");
    document.getElementById("editId").value=idx;
    document.getElementById("orderDate").value=it.orderDate;
    document.getElementById("orderNo").value=it.orderNo;

    multiRows = Array.isArray(it.multiItems) ? JSON.parse(JSON.stringify(it.multiItems)) : [{artist:"",name:"",style:"",qty:""}];
    renderMultiRows();

    document.getElementById("oriCny").value=it.oriCny;
    document.getElementById("payCny").value=it.payCny;
    document.getElementById("payTwd").value=it.payTwd;
    document.getElementById("recvTwd").value=it.recvTwd;
    document.getElementById("last5").value=it.last5||"";
    document.getElementById("recvSource").value=it.recvSource;
    document.getElementById("recvDate").value=it.recvDate;
    document.getElementById("platform").value=it.platform;
    document.getElementById("shopName").value=it.shopName;
    document.getElementById("remark").value=it.remark;
    tempPhotos = it.photos || [];
    renderPhotoPreview();
    calcMain();
  }else{
    openForm("normal");
    document.getElementById("editId").value=idx;
    document.getElementById("orderDate").value=it.orderDate;
    document.getElementById("orderNo").value=it.orderNo;
    document.getElementById("artist").value=it.artist;
    document.getElementById("prodName").value=it.prodName;
    document.getElementById("style").value=it.style;
    document.getElementById("qty").value=it.qty;
    document.getElementById("oriCny").value=it.oriCny;
    document.getElementById("payCny").value=it.payCny;
    document.getElementById("payTwd").value=it.payTwd;
    document.getElementById("recvTwd").value=it.recvTwd;
    document.getElementById("last5").value=it.last5||"";
    document.getElementById("recvSource").value=it.recvSource;
    document.getElementById("recvDate").value=it.recvDate;
    document.getElementById("platform").value=it.platform;
    document.getElementById("shopName").value=it.shopName;
    document.getElementById("remark").value=it.remark;
    tempPhotos = it.photos || [];
    renderPhotoPreview();
    calcMain();
  }
}
function delItem(idx){
  if(!confirm("確認刪除這筆帳務？")) return;
  data.products.splice(idx,1);
  saveStorage();
  renderAll();
}

window.onload = ()=>{
  loadData();
  // 點空白關閉建議選單
  document.addEventListener("click",(ev)=>{
    if(!ev.target.closest(".auto-suggest")){
      document.querySelectorAll(".suggest-list").forEach(x=>x.style.display="none");
    }
  })
}
