<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>代購記帳系統</title>
<style>
*{box-sizing:border-box;font-family:system-ui, sans-serif;margin:0;padding:0}
body{padding:16px;background:#f7f5ff;color:#333}
h2{color:#6b4fc7;margin-bottom:16px}
.section{background:#fff;border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px #00000012}
.group-title{background:#9370db;color:#fff;padding:10px 14px;border-radius:10px;margin:12px 0;font-weight:bold;font-size:18px}
.row{display:grid;grid-template-columns: repeat(auto-fit, minmax(190px,1fr));gap:10px;margin-bottom:10px}
.item{display:flex;flex-direction:column;position:relative}
label{font-size:13px;color:#555;margin-bottom:4px}
input, select, textarea{padding:8px 10px;border:1px solid #d9d2ee;border-radius:8px;font-size:14px}
input[type="number"]{inputmode:decimal}
input::placeholder{color:#bbbbbb;opacity:0.3}
button{cursor:pointer;border:none;border-radius:9px;padding:9px 14px;font-size:14px}
.btn-primary{background:#9370db;color:#fff}
.btn-success{background:#48b870;color:#fff}
.btn-warning{background:#e6a849;color:#fff}
.btn-danger{background:#dd5555;color:#fff}
.btn-add-line{opacity:0.7;background:#b8a0e8;color:#fff;margin:8px 0}
.btn-bottom-bar{width:100%;margin-top:12px;display:flex;gap:10px}
.photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.photo-preview img{width:100px;height:100px;object-fit:cover;border-radius:6px;border:1px solid #ddd}
.product-block{border:1px dashed #c9bcee;border-radius:10px;padding:12px;margin:10px 0}
.record-card{border:1px solid #e5e0f7;border-radius:12px;padding:14px;margin:10px 0}
.record-card .action-bar{margin-top:10px;display:flex;gap:8px}
.modal{position:fixed;inset:0;background:#00000044;display:flex;align-items:center;justify-content:center;padding:16px;z-index:999}
.modal-inner{background:#fff;border-radius:16px;padding:20px;width:100%;max-width:1100px;max-height:90vh;overflow-y:auto}
.hidden{display:none !important}
.note{grid-column:1/-1}
.datalist-wrap{position:relative}
.datalist-suggest{position:absolute;top:calc(100% + 2px);left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:0 0 8px 8px;z-index:100;max-height:160px;overflow-y:auto}
.datalist-suggest div{padding:7px 10px;cursor:pointer}
.datalist-suggest div:hover{background:#f0ecfc}
</style>
</head>

<h2>📒 代購記帳</h2>

<script>
let photoList = [];
let editPhotoList = [];
let allRecords = JSON.parse(localStorage.getItem("buyRecords")) || [];
let autoComplete = JSON.parse(localStorage.getItem("autoComplete")) || {
  orderAccount: [],
  artist: [],
  shopName: [],
  payType: ["支付寶¥-中信","支付寶¥-國泰","支付寶-¥餘額","微信¥-中信","微信¥-國泰","微信-¥餘額","中信$","郵局$","台新$","國泰$","台灣配$"],
  receiveSource: ["中信$","郵局$","中信無卡$","台新$","台新無卡$","國泰$","台灣配$","LINE BANK","i pass money","line pay money"],
  sourceSel: ["淘寶","淘寶（騰訊）","淘寶（優酷）","淘寶（愛奇藝）","騰訊","優酷","愛奇藝","小芒","微店","微信（拼團呀）","微信（拼谷）","閑魚","小紅書","抖音","京東","QQ音樂","酷狗音樂","網易雲","拼多多","阿里巴巴","微博","紛玩島","大麥","百度網盤"]
};

function saveAutoComplete(){
  localStorage.setItem("autoComplete", JSON.stringify(autoComplete));
}
function saveRecords(){
  localStorage.setItem("buyRecords", JSON.stringify(allRecords));
}

function getTodayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

document.querySelector("#orderDate").value = getTodayStr();
document.querySelector("#receiveDate").value = getTodayStr();
addProductRow();
renderAll();

// 下拉切換其它輸入框
document.querySelector("#payType").onchange = function(){
  document.querySelector("#payTypeCustom").classList.toggle("hidden", this.value!="_other");
}
document.querySelector("#receiveSource").onchange = function(){
  document.querySelector("#receiveSourceCustom").classList.toggle("hidden", this.value!="_other");
}
document.querySelector("#sourceSel").onchange = function(){
  document.querySelector("#sourceCustom").classList.toggle("hidden", this.value!="_other");
}
document.querySelector("#e_payType").onchange = function(){

}
document.querySelector("#e_receiveSource").onchange = function(){

}
document.querySelector("#e_sourceSel").onchange = function(){
  document.querySelector("#e_sourceCustom").classList.toggle("hidden", this.value!="_other");
}

// 自動建議下拉
function bindSuggest(inputId, suggestId, keyName){
  const inp = document.getElementById(inputId);
  const sugWrap = document.getElementById(suggestId);
  inp.oninput = ()=>{
    const val = inp.value.trim().toLowerCase();
    sugWrap.innerHTML = "";
    if(val.length===0){ sugWrap.classList.add("hidden"); return; }
    const filter = autoComplete[keyName].filter(x=>x.toLowerCase().includes(val));
    if(filter.length===0){ sugWrap.classList.add("hidden"); return; }
    filter.forEach(item=>{
      const div = document.createElement("div");
      div.innerText = item;
      div.onclick = ()=>{ inp.value = item; sugWrap.classList.add("hidden"); };
      sugWrap.appendChild(div);
    })
    sugWrap.classList.remove("hidden");
  }
  document.addEventListener("click",(e)=>{
    if(!inp.contains(e.target) && !sugWrap.contains(e.target)) sugWrap.classList.add("hidden");
  })
}
bindSuggest("orderAccount","suggest_orderAccount","orderAccount");
bindSuggest("artist","suggest_artist","artist");
bindSuggest("shopName","suggest_shopName","shopName");

// 新增商品列
function addProductRow(){
  const wrap = document.getElementById("productList");
  const div = document.createElement("div");
  div.className="product-block";
  div.innerHTML = `
  <div class="row">
    <div class="item"><label>商品名稱</label><input type="text" class="p_name"></div>
    <div class="item"><label>款式</label><input type="text" class="p_style"></div>
    <div class="item"><label>數量</label><input type="number" class="p_qty" value="1"></div>
    <div class="item"><button class="btn-danger" onclick="this.closest('.product-block').remove()">刪除這組</button></div>
  </div>`;
  wrap.appendChild(div);
}
function addEditProductRow(){
  const wrap = document.getElementById("e_productList");
  const div = document.createElement("div");
  div.className="product-block";
  div.innerHTML = `
  <div class="row">
    <div class="item"><label>商品名稱</label><input type="text" class="ep_name"></div>
    <div class="item"><label>款式</label><input type="text" class="ep_style"></div>

    <div class="item"><button class="btn-danger" onclick="this.closest('.product-block').remove()">刪除這組</button></div>
  </div>`;
  wrap.appendChild(div);
}

// 計算公式
function calcAll(){
  const receiveTwd = Number(document.querySelector("#receiveTwd").value||0);
  const payTwd = Number(document.querySelector("#payTwd").value||0);
  const payRmb = Number(document.querySelector("#payRmb").value||0);
  const fee = Math.round(receiveTwd * 0.015);
  const profit = receiveTwd - (payTwd + fee);
  const rate = payRmb>0 ? (payTwd / payRmb).toFixed(4) : 0;
  document.querySelector("#fee").value = fee;
  document.querySelector("#profit").value = profit.toFixed(2);
  document.querySelector("#rate").value = rate;
}
function calcEditAll(){
  const receiveTwd = Number(document.querySelector("#e_receiveTwd").value||0);
  const payTwd = Number(document.querySelector("#e_payTwd").value||0);
  const payRmb = Number(document.querySelector("#e_payRmb").value||0);
  const fee = Math.round(receiveTwd * 0.015);
  const profit = receiveTwd - (payTwd + fee);
  const rate = payRmb>0 ? (payTwd / payRmb).toFixed(4) : 0;
  document.querySelector("#e_fee").value = fee;
  document.querySelector("#e_profit").value = profit.toFixed(2);
  document.querySelector("#e_rate").value = rate;
}

// 照片處理
document.querySelector("#photoInput").onchange = async function(e){
  for(let f of e.target.files){
    photoList.push(await fileToBase64(f));
  }
  renderPhotoPreview();
}
document.querySelector("#e_photoInput").onchange = async function(e){
  for(let f of e.target.files){
    editPhotoList.push(await fileToBase64(f));
  }
  renderEditPhotoPreview();
}
function fileToBase64(file){
  return new Promise(resolve=>{
    const r = new FileReader();
    r.onload = ()=>resolve(r.result);
    r.readAsDataURL(file);
  })
}
function renderPhotoPreview(){
  const wrap = document.getElementById("photoPreview");
  wrap.innerHTML = "";
  photoList.forEach((src,i)=>{
    wrap.innerHTML += `<div><img src="${src}"><button onclick="photoList.splice(${i},1);renderPhotoPreview()">X</button></div>`
  })
}
function renderEditPhotoPreview(){
  const wrap = document.getElementById("e_photoPreview");
  wrap.innerHTML = "";
  editPhotoList.forEach((src,i)=>{
    wrap.innerHTML += `<div><img src="${src}"><button onclick="editPhotoList.splice(${i},1);renderEditPhotoPreview()">X</button></div>`
  })
}

// 收集商品
function getProductList(selector){
  const arr = [];
  document.querySelectorAll(selector).forEach(block=>{
    arr.push({
      name:block.querySelector(".p_name, .ep_name").value,
      style:block.querySelector(".p_style, .ep_style").value,
      qty:block.querySelector(".p_qty, .ep_qty").value
    })
  })
  return arr;
}

// 新增儲存
function submitRecord(){
  let payType = document.querySelector("#payType").value;
  if(payType==="_other") payType = document.querySelector("#payTypeCustom").value.trim();
  let receiveSource = document.querySelector("#receiveSource").value;
  if(receiveSource==="_other") receiveSource = document.querySelector("#receiveSourceCustom").value.trim();
  let sourceSel = document.querySelector("#sourceSel").value;
  if(sourceSel==="_other") sourceSel = document.querySelector("#sourceCustom").value.trim();

  // 自動記憶選項
  if(payType && !autoComplete.payType.includes(payType)) autoComplete.payType.push(payType);
  if(receiveSource && !autoComplete.receiveSource.includes(receiveSource)) autoComplete.receiveSource.push(receiveSource);
  if(sourceSel && !autoComplete.sourceSel.includes(sourceSel)) autoComplete.sourceSel.push(sourceSel);
  const acc = document.querySelector("#orderAccount").value.trim();
  const art = document.querySelector("#artist").value.trim();
  const shop = document.querySelector("#shopName").value.trim();
  if(acc && !autoComplete.orderAccount.includes(acc)) autoComplete.orderAccount.push(acc);
  if(art && !autoComplete.artist.includes(art)) autoComplete.artist.push(art);
  if(shop && !autoComplete.shopName.includes(shop)) autoComplete.shopName.push(shop);
  saveAutoComplete();

  const data = {
    id:Date.now().toString(),
    orderDate:document.querySelector("#orderDate").value,
    orderAccount:acc,
    artist:art,
    products:getProductList("#productList .product-block"),
    oriRmb:document.querySelector("#oriRmb").value,
    payRmb:document.querySelector("#payRmb").value,
    payTwd:document.querySelector("#payTwd").value,
    fee:document.querySelector("#fee").value,
    profit:document.querySelector("#profit").value,
    rate:document.querySelector("#rate").value,
    receiveTwd:document.querySelector("#receiveTwd").value,
    payType:payType,
    receiveSource:receiveSource,
    receiveDate:document.querySelector("#receiveDate").value,
    sourceSel:sourceSel,
    shopName:shop,
    infoSource:document.querySelector("#infoSource").value,
    urlField:document.querySelector("#urlField").value,
    photos:photoList,
    note:document.querySelector("#note").value
  }
  allRecords.push(data);
  saveRecords();
  alert("✅ 儲存成功，可繼續輸入新訂單");
  resetForm();
  renderAll();
}

function resetForm(){
  document.querySelector("#orderDate").value = getTodayStr();
  document.querySelector("#receiveDate").value = getTodayStr();
  document.querySelector("#orderAccount").value = "";
  document.querySelector("#artist").value = "";
  document.querySelector("#oriRmb").value = "";
  document.querySelector("#payRmb").value = "";
  document.querySelector("#payTwd").value = "";
  document.querySelector("#fee").value = "";
  document.querySelector("#profit").value = "";
  document.querySelector("#rate").value = "";
  document.querySelector("#receiveTwd").value = "";
  document.querySelector("#payType").value = autoComplete.payType[0];
  document.querySelector("#payTypeCustom").value = "";
  document.querySelector("#payTypeCustom").classList.add("hidden");
  document.querySelector("#receiveSource").value = autoComplete.receiveSource[0];
  document.querySelector("#receiveSourceCustom").value = "";
  document.querySelector("#receiveSourceCustom").classList.add("hidden");
  document.querySelector("#sourceSel").value = autoComplete.sourceSel[0];
  document.querySelector("#sourceCustom").value = "";
  document.querySelector("#sourceCustom").classList.add("hidden");
  document.querySelector("#shopName").value = "";
  document.querySelector("#infoSource").value = "";
  document.querySelector("#urlField").value = "";
  document.querySelector("#note").value = "";
  photoList = []; renderPhotoPreview();
  document.getElementById("productList").innerHTML=""; addProductRow();
}

function goHome(){
  resetForm();
  window.scrollTo(0,0);
}

// 渲染列表、年月分組
function renderAll(){
  const group = {};
  allRecords.forEach(r=>{
    const [y,m] = r.orderDate.split("-");
    const key = `${y}-${m}`;
    if(!group[key]) group[key]=[];
    group[key].push(r);
  })
  const wrap = document.getElementById("recordList");
  wrap.innerHTML = "";
  Object.keys(group).sort().reverse().forEach(ym=>{
    wrap.innerHTML += `<div class="group-title">📅 ${ym}</div>`;
    group[ym].forEach(rec=>{
      wrap.innerHTML += `
      <div class="record-card">
        <div><b>訂購帳號：</b>${rec.orderAccount}｜<b>藝人：</b>${rec.artist}</div>
        <div><b>訂購日期：</b>${rec.orderDate}</div>
        <div><b>商品：</b>${rec.products.map(p=>`${p.name} ${p.style} ×${p.qty}`).join("、")}</div>
        <div><b>店面名稱：</b>${rec.shopName}</div>
        <div><b>實收台幣：</b>$${rec.receiveTwd}｜<b>實際利潤：</b>$${rec.profit}</div>
        <div class="action-bar">
          <button class="btn-warning" onclick="openEdit('${rec.id}')">✏️ 編輯</button>
        </div>
      </div>`
    })
  })
}

// 編輯彈窗
function openEdit(id){
  const rec = allRecords.find(x=>x.id===id);
  if(!rec) return;
  document.querySelector("#editId").value = rec.id;
  document.querySelector("#e_orderDate").value = rec.orderDate;
  document.querySelector("#e_orderAccount").value = rec.orderAccount;
  document.querySelector("#e_artist").value = rec.artist;
  document.querySelector("#e_oriRmb").value = rec.oriRmb;
  document.querySelector("#e_payRmb").value = rec.payRmb;
  document.querySelector("#e_payTwd").value = rec.payTwd;
  document.querySelector("#e_fee").value = rec.fee;
  document.querySelector("#e_profit").value = rec.profit;
  document.querySelector("#e_rate").value = rec.rate;
  document.querySelector("#e_receiveTwd").value = rec.receiveTwd;
  document.querySelector("#e_payType").value = autoComplete.payType.includes(rec.payType) ? rec.payType : "_other";
  document.querySelector("#e_payTypeCustom").value = autoComplete.payType.includes(rec.payType) ? "" : rec.payType;
  document.querySelector("#e_payTypeCustom").classList.toggle("hidden", autoComplete.payType.includes(rec.payType));
  document.querySelector("#e_receiveSource").value = autoComplete.receiveSource.includes(rec.receiveSource) ? rec.receiveSource : "_other";
  document.querySelector("#e_receiveSourceCustom").value = autoComplete.receiveSource.includes(rec.receiveSource) ? "" : rec.receiveSource;
  document.querySelector("#e_receiveSourceCustom").classList.toggle("hidden", autoComplete.receiveSource.includes(rec.receiveSource));
  document.querySelector("#e_sourceSel").value = autoComplete.sourceSel.includes(rec.sourceSel) ? rec.sourceSel : "_other";
  document.querySelector("#e_sourceCustom").value = autoComplete.sourceSel.includes(rec.sourceSel) ? "" : rec.sourceSel;
  document.querySelector("#e_sourceCustom").classList.toggle("hidden", autoComplete.sourceSel.includes(rec.sourceSel));
  document.querySelector("#e_shopName").value = rec.shopName;
  document.querySelector("#e_infoSource").value = rec.infoSource;
  document.querySelector("#e_urlField").value = rec.urlField;
  document.querySelector("#e_note").value = rec.note;
  editPhotoList = rec.photos || [];
  renderEditPhotoPreview();
  const epWrap = document.getElementById("e_productList");
  epWrap.innerHTML="";
  rec.products.forEach(p=>{
    const div = document.createElement("div");
    div.className="product-block";
    div.innerHTML = `
    <div class="row">
      <div class="item"><label>商品名稱</label><input type="text" class="ep_name" value="${p.name}"></div>
      <div class="item"><label>款式</label><input type="text" class="ep_style" value="${p.style}"></div>
      <div class="item"><label>數量</label><input type="number" class="ep_qty" value="${p.qty}"></div>
      <div class="item"><button class="btn-danger" onclick="this.closest('.product-block').remove()">刪除這組</button></div>
    </div>`;
    epWrap.appendChild(div);
  })
  document.getElementById("editModal").classList.remove("hidden");
}
function closeEditModal(){
  document.getElementById("editModal").classList.add("hidden");
}
function saveEdit(){
  const id = document.querySelector("#editId").value;
  let payType = document.querySelector("#e_payType").value;
  if(payType==="_other") payType = document.querySelector("#e_payTypeCustom").value.trim();
  let receiveSource = document.querySelector("#e_receiveSource").value;
  if(receiveSource==="_other") receiveSource = document.querySelector("#e_receiveSourceCustom").value.trim();
  let sourceSel = document.querySelector("#e_sourceSel").value;
  if(sourceSel==="_other") sourceSel = document.querySelector("#e_sourceCustom").value.trim();

  if(payType && !autoComplete.payType.includes(payType)) autoComplete.payType.push(payType);
  if(receiveSource && !autoComplete.receiveSource.includes(receiveSource)) autoComplete.receiveSource.push(receiveSource);
  if(sourceSel && !autoComplete.sourceSel.includes(sourceSel)) autoComplete.sourceSel.push(sourceSel);
  const acc = document.querySelector("#e_orderAccount").value.trim();
  const art = document.querySelector("#e_artist").value.trim();
  const shop = document.querySelector("#e_shopName").value.trim();
  if(acc && !autoComplete.orderAccount.includes(acc)) autoComplete.orderAccount.push(acc);
  if(art && !autoComplete.artist.includes(art)) autoComplete.artist.push(art);
  if(shop && !autoComplete.shopName.includes(shop)) autoComplete.shopName.push(shop);
  saveAutoComplete();

  const data = {
    id:id,
    orderDate:document.querySelector("#e_orderDate").value,
    orderAccount:acc,
    artist:art,
    products:getProductList("#e_productList .product-block"),
    oriRmb:document.querySelector("#e_oriRmb").value,
    payRmb:document.querySelector("#e_payRmb").value,
    payTwd:document.querySelector("#e_payTwd").value,
    fee:document.querySelector("#e_fee").value,
    profit:document.querySelector("#e_profit").value,
    rate:document.querySelector("#e_rate").value,
    receiveTwd:document.querySelector("#e_receiveTwd").value,
    payType:payType,
    receiveSource:receiveSource,
    receiveDate:document.querySelector("#e_receiveDate").value,
    sourceSel:sourceSel,
    shopName:shop,
    infoSource:document.querySelector("#e_infoSource").value,
    urlField:document.querySelector("#e_urlField").value,
    photos:editPhotoList,
    note:document.querySelector("#e_note").value
  }
  const idx = allRecords.findIndex(x=>x.id===id);
  allRecords[idx] = data;
  saveRecords();
  alert("✅ 修改儲存完成");
  closeEditModal();
  renderAll();
}
</script>
</body>
</html>
